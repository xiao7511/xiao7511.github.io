<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>内容管理后台 —— 终极自适应控制台</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ==========================================
           🎨 二次元/像素现代主义：高级深色系后台主题样式 
           ========================================== */
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c20 0%, #15102a 100%);
            --panel-bg: rgba(25, 20, 45, 0.75);
            --border-glow: rgba(138, 43, 226, 0.25);
            --primary-glow: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            --accent-neon: #00f5ff;
            --text-main: #f1f2f6;
            --text-muted: #a4b0be;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            padding: 16px; /* 移动端默认紧凑边距 */
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* 清除手机端点击高亮蓝框 */
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: auto;
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 20px; /* 缩减手机端的内边距 */
            border-radius: 16px;
            border: 1px solid var(--border-glow);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        /* 顶部导航控制栏响应式 */
        .header-box {
            display: flex;
            flex-direction: column; /* 手机端默认纵向堆叠 */
            gap: 14px;
            align-items: flex-start;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.3rem; /* 降低手机标题字号 */
            margin: 0;
            font-weight: 800;
            background: linear-gradient(120deg, #ffffff, var(--accent-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .back-home-btn {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main) !important;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 8px 16px; /* 增大手机触控面积 */
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-decoration: none !important;
            transition: all 0.2s;
        }
        .back-home-btn:hover { background: var(--primary-glow); border-color: transparent; }

        .back-arrow { margin-right: 6px; }

        .upload-card {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-sizing: border-box;
        }

        h2 {
            font-size: 1.05rem;
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 统一放大手机端下拉菜单的热区，极易点中 */
        select {
            width: 100%;
            background: #1c1836;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px; 
            border-radius: 8px;
            font-size: 0.95rem; /* 防止 iOS 自动放大表单 */
            outline: none;
            box-sizing: border-box;
        }

        /* 移动端深度调优的交互式点击/拖拽区 */
        .dropzone-area {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            margin: 16px 0;
            box-sizing: border-box;
        }
        .dropzone-area:active {
            border-color: var(--accent-neon);
            background: rgba(0, 245, 255, 0.04);
        }

        /* 关键：保留原生上传控件的可点击层级，但完全透明，完美唤醒移动端相机/相册 */
        input[type='file'] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
            z-index: 5;
        }

        .action-btn {
            width: 100%;
            background: var(--primary-glow);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            padding: 14px; /* 手机端加高 */
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(106, 17, 203, 0.3);
            transition: opacity 0.2s;
        }
        .action-btn:active { opacity: 0.8; }
        .action-btn:disabled { background: #2e2a44; color: var(--text-muted); cursor: not-allowed; box-shadow: none; }

        #upload-status {
            margin-top: 14px; padding: 12px; border-radius: 8px;
            font-size: 0.85rem; text-align: center; line-height: 1.4;
        }
        .status-info { background: rgba(37, 117, 252, 0.15); color: #3a86ff; }
        .status-success { background: rgba(46, 213, 115, 0.15); color: #2ed573; }
        .status-error { background: rgba(255, 71, 87, 0.15); color: #ff4757; }

        /* 看板网格与部署系统布局 */
        .preview-dashboard { margin-top: 32px; }
        
        .dashboard-section {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 20px;
        }
        
        .section-header {
            display: flex; 
            flex-direction: row; 
            justify-content: space-between; 
            align-items: center;
            margin-bottom: 14px; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            padding-bottom: 10px;
            gap: 10px;
        }
        
        .section-title { font-weight: 700; color: var(--accent-neon); font-size: 0.95rem; }
        
        .deploy-btn {
            background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
            color: white; border: none; padding: 8px 14px; border-radius: 6px;
            font-weight: 600; cursor: pointer; font-size: 0.8rem;
            white-space: nowrap; /* 拒绝手机端按钮文字换行 */
            box-shadow: 0 4px 8px rgba(0, 206, 201, 0.2);
        }
        .deploy-btn:active { opacity: 0.9; }

        /* 📱 核心自适应网格：手机端默认为极佳的双列排版，大屏自动扩展 */
        .image-flow-grid {
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 10px;
        }
        
        .img-preview-card {
            background: #110d24; border-radius: 8px; padding: 8px; text-align: center;
            border: 1px solid rgba(255,255,255,0.03);
            box-sizing: border-box;
        }

        /* 🎨 优化后的预览区容器：高度自适应，保证图片完整呈现 */
        .img-container { 
            width: 100%; 
            min-height: 90px; 
            max-height: 180px; /* 限制手机端最大高度，防止拉得过长 */
            border-radius: 6px; 
            overflow: hidden; 
            background: #090616; /* 给图床加个深色背景垫底 */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .img-container img { 
            width: 100%; 
            height: auto; 
            max-height: 180px;
            object-fit: contain; /* 💡 核心修改：改为 contain，确保整张图片按比例完整缩放显示，绝不裁剪 */
        }
        
        .badge {
            font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 6px;
            background: rgba(255,255,255,0.06); color: var(--text-muted);
        }

        /* 🖥️ 媒体查询：当屏幕尺寸大于 600 像素时（电脑/平板），无缝舒展宏大视口 */
        @media (min-width: 600px) {
            body { padding: 40px 20px; }
            .container { padding: 35px; border-radius: 24px; }
            .header-box { flex-direction: row; justify-content: space-between; align-items: center; }
            h1 { font-size: 1.6rem; }
            h2 { font-size: 1.2rem; }
            .upload-card { padding: 25px; }
            .dropzone-area { padding: 35px 20px; }
            .image-flow-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
            .img-container { height: 90px; }
            .badge { font-size: 0.75rem; }
            .section-title { font-size: 1.05rem; }
            .deploy-btn { font-size: 0.85rem; padding: 8px 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-box">
            <h1>内容管理后台 —— 终极自适应控制台</h1>
            <a href="index.html" class="back-home-btn"><span class="back-arrow">←</span> 返回站点主页</a>
        </div>

        <div class="upload-card">
            <h2><span>🔮</span> 批量上传文件 (手机端支持多选/拍照)</h2>
            
            <div style="margin-bottom: 16px;">
                <label style="display:block; margin-bottom:8px; font-size:0.85rem; color:var(--text-muted);">目标更新版面</label>
                <select id="page-section">
                    <option value="section_banner">首页Banner大图轮播</option>
                    <option value="section_anime">动漫版面多图轮播</option>
                    <option value="section_community">社区交流多图轮播</option>
                    <option value="section_recommend">热门强推多图轮播</option>
                </select>
            </div>

            <div class="dropzone-area" id="drop-zone">
                <span style="font-size:2.2rem; display:block; margin-bottom:8px;">📥</span>
                <span class="dropzone-text">点击批量选择相册文件或拍照</span>
                <input type="file" id="file-input" accept="image/*" multiple />
            </div>

            <button id="upload-btn" class="action-btn" disabled>确认上传至下方预览库</button>
            <div id="upload-status" class="status-info" style="display: block;">正在建立安全链路，请稍候...</div>
        </div>

        <div class="preview-dashboard">
            <h2><span>🖼️</span> 线上运行与待部署图库看板 (先预览，后部署)</h2>
            <div id="sections-wrapper"></div>
        </div>
    </div>

<script>
    // 💡 安全锁变量提升，防止 verifyAdminAuth 读取到未初始化的全局变量
    window.supabaseClient = null;
    let selectedFilesCache = []; 

    async function initWorkflow() {
        const statusEl = document.getElementById('upload-status');
        try {
            const workerUrl = 'https://supabase-config-api.xiao-ye751111.workers.dev/'; 
            
            // 移动端硬超时探测机制，防止 Worker 被部分手机网络和环境误拦卡死
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 2500);

            let config = null;
            try {
                const response = await fetch(workerUrl, { signal: controller.signal });
                clearTimeout(timeoutId);
                if (!response.ok) throw new Error();
                config = await response.json();
            } catch (e) {
                console.warn("Worker连接受阻，自动激活移动直连兜底通道。");
                config = {
                    SUPABASE_URL: "https://kogjjfccyncdszuuwlun.supabase.co",
                    SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtvZ2pqZmNjeW5jZHN6dXV3bHVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4ODEwMDksImV4cCI6MjA5MDQ1NzAwOX0.JIjUQdbZYUM6Cu57pFVwVzrlTrvyYmFyE9eBRlR9Sec"
                };
            }
            
            let cleanedUrl = (config.SUPABASE_URL || '').trim();
            if (cleanedUrl.endsWith('/')) cleanedUrl = cleanedUrl.slice(0, -1);

            // 🌟 关键修复：先实例化客户端，再执行鉴权流水线，彻底根治 getSession of undefined 报错
            window.supabaseClient = supabase.createClient(cleanedUrl, (config.SUPABASE_ANON_KEY || '').trim());
            
            // 安全鉴权会话扫描
            const session = await verifyAdminAuth();
            if (!session) return; 

            showStatus('✨ 安全通信链路已就绪。支持手机批量传图和拍照。', 'info');
            
            activateUploadListener(cleanedUrl);
            await refreshLiveDashboard(cleanedUrl);

        } catch (error) {
            console.error(error);
            showStatus('核心数据引擎初始化断开，请刷新页面重试。', 'error');
        }
    }

    async function verifyAdminAuth() {
        if (!window.supabaseClient) return null;
        const OWNER_EMAIL = 'xiao.ye751111@outlook.com';
        const { data: { session }, error } = await window.supabaseClient.auth.getSession();

        if (error || !session) {
            alert('未检测到合法管理员登录状态！');
            window.location.href = 'index.html';
            return null;
        }
        if (session.user.email !== OWNER_EMAIL) {
            alert(`账号 ${session.user.email} 无控制台访问特权。`);
            window.location.href = 'index.html';
            return null;
        }
        return session;
    }

    function activateUploadListener(supabaseUrl) {
        const uploadBtn = document.getElementById('upload-btn');
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');

        uploadBtn.disabled = false;

        fileInput.addEventListener('change', () => {
            selectedFilesCache = Array.from(fileInput.files);
            if (selectedFilesCache.length > 0) {
                dropZone.querySelector('.dropzone-text').innerHTML = `已选中 <em style="color:#2ed573; font-weight:bold;">${selectedFilesCache.length}</em> 张图片，准备就绪。`;
            }
        });

        // 批量无损推送到云仓 Bucket
        uploadBtn.addEventListener('click', async () => {
            if (selectedFilesCache.length === 0) {
                alert('请先拍照或选取相册图片！');
                return;
            }

            const section = document.getElementById('page-section').value;
            showStatus(`⚡ 正在并发上传 ${selectedFilesCache.length} 张图片到云仓预览缓冲区...`, 'info');

            try {
                for (let i = 0; i < selectedFilesCache.length; i++) {
                    const file = selectedFilesCache[i];
                    const fileName = `${section}_${i}.png`; 
                    
                    await window.supabaseClient.storage
                        .from('images')
                        .upload(`images/${fileName}`, file, { upsert: true });
                }

                showStatus('🎉 预览库更新成功！请在下方核对多图，核对无误后点击“一键部署”。', 'success');
                selectedFilesCache = [];
                fileInput.value = '';
                dropZone.querySelector('.dropzone-text').innerHTML = '点击批量选择相册文件或拍照';
                
                // 刷新预览图看台
                await refreshLiveDashboard(supabaseUrl);

            } catch (err) {
                showStatus('上传流发生阻断: ' + err.message, 'error');
            }
        });
    }

    // 动态绘制响应式双列网格看板（带防手机强缓存穿透时间戳）
    // 渲染带有“部署”锁的控制面板（加入多重强刷机制，击穿手机缓存）
    async function refreshLiveDashboard(supabaseUrl) {
        const wrapper = document.getElementById('sections-wrapper');
        if (!wrapper) return;

        const sections = [
            { id: 'section_banner', name: '首页 Banner 大图轮播区', maxCount: 5 },
            { id: 'section_anime', name: '动漫版面轮播区', maxCount: 4 },
            { id: 'section_community', name: '社区交流轮播区', maxCount: 4 },
            { id: 'section_recommend', name: '热门强推卡牌轮播区', maxCount: 4 }
        ];

        wrapper.innerHTML = '';

        for (const item of sections) {
            const block = document.createElement('div');
            block.className = 'dashboard-section';

            // 头部：标题 + 一键部署按钮
            const header = document.createElement('div');
            header.className = 'section-header';
            header.innerHTML = `
                <div class="section-title">📺 ${item.name}</div>
                <button class="deploy-btn" onclick="deploySection('${item.id}', ${item.maxCount}, '${supabaseUrl}')">🚀 一键部署到主页</button>
            `;

            // 图片流网格布局
            const grid = document.createElement('div');
            grid.className = 'image-flow-grid';

            // 循环生成预览列
            for (let i = 0; i < item.maxCount; i++) {
                const card = document.createElement('div');
                card.className = 'img-preview-card';
                
                // 💡 核心优化：采用带有当前毫秒级时间戳的微调动态 URL，彻底断绝手机浏览器的旧缓存
                const cacheBuster = `?t=${new Date().getTime()}_${Math.random().toString(36).substr(2, 5)}`;
                const liveImgUrl = `${supabaseUrl}/storage/v1/object/public/images/images/${item.id}_${i}.png${cacheBuster}`;

                card.innerHTML = `
                    <div class="img-container">
                        <img src="${liveImgUrl}" onerror="this.parentElement.parentElement.style.style.visibility='hidden'"/>
                    </div>
                    <span class="badge">索引位置 [${i}]</span>
                `;
                grid.appendChild(card);
            }

            block.appendChild(header);
            block.appendChild(grid);
            wrapper.appendChild(block);
        }
    }

    // 💡 核心部署锁：优化为免网络探测直通常道，彻底规避跨域拦截
    window.deploySection = async function(section, maxCount, supabaseUrl) {
        let deployedUrls = [];
        
        // 按照版面最大数量，直接硬核拼接出对应的线上 CDN 图片路径，加入高精度时间戳穿透手机缓存
        for (let i = 0; i < maxCount; i++) {
            const liveUrl = `${supabaseUrl}/storage/v1/object/public/images/images/${section}_${i}.png`;
            deployedUrls.push(`${liveUrl}?t=${new Date().getTime()}`);
        }

        try {
            showStatus(`正在下发 [${section}] 的部署指令...`, 'info');
            
            // 将图片以 JSON 字符串数组形式同步写入数据库配置表
            const { error } = await window.supabaseClient
                .from('site_config')
                .upsert([{ section: section, url: JSON.stringify(deployedUrls) }]);

            if (error) throw error;
            
            alert('✨ 部署指令已安全同步！主页相应版面多图轮播已实时覆盖。');
            showStatus('🎉 部署成功！前台数据流已刷新。', 'success');

        } catch (err) {
            alert('部署同步失败: ' + err.message);
            showStatus('部署失败: ' + err.message, 'error');
        }
    };

    function showStatus(msg, type) {
        const el = document.getElementById('upload-status');
        el.style.display = 'block'; 
        el.innerText = msg;
        el.className = ''; 
        if (type === 'info') el.className = 'status-info';
        if (type === 'success') el.className = 'status-success';
        if (type === 'error') el.className = 'status-error';
    }

    document.addEventListener('DOMContentLoaded', initWorkflow);
</script>
</body>
</html>
