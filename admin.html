<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>内容管理后台 —— 终极自适应控制台</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c20 0%, #15102a 100%);
            --panel-bg: rgba(25, 20, 45, 0.75);
            --border-glow: rgba(138, 43, 226, 0.25);
            --primary-glow: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            --accent-neon: #00f5ff;
            --text-main: #f1f2f6;
            --text-muted: #a4b0be;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: auto;
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-glow);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        .header-box {
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: flex-start;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.3rem;
            margin: 0;
            font-weight: 800;
            background: linear-gradient(120deg, #ffffff, var(--accent-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .back-home-btn {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main) !important;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-decoration: none !important;
            transition: all 0.2s;
        }
        .back-home-btn:hover { background: var(--primary-glow); border-color: transparent; }

        .upload-card {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-sizing: border-box;
        }

        h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        select {
            width: 100%;
            background: #1c1836;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px; 
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            box-sizing: border-box;
        }

        /* 🎯 核心改良：dropzone 区域包裹隐形 input，确保绝对不会溢出到外面影响别人 */
        .dropzone-area {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            margin: 16px 0;
            box-sizing: border-box;
            overflow: hidden;
        }
        .dropzone-area input[type='file'] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
            z-index: 2;
        }

        .action-btn {
            width: 100%;
            background: var(--primary-glow);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(106, 17, 203, 0.3);
        }

        #upload-status {
            margin-top: 14px; padding: 12px; border-radius: 8px;
            font-size: 0.85rem; text-align: center;
        }
        .status-info { background: rgba(37, 117, 252, 0.15); color: #3a86ff; }
        .status-success { background: rgba(46, 213, 115, 0.15); color: #2ed573; }
        .status-error { background: rgba(255, 71, 87, 0.15); color: #ff4757; }

        .preview-dashboard { margin-top: 32px; }
        
        /* 🎯 核心改良：画看板大网格，PC端采用多列，移动端采用自适应强行回档 */
        .image-flow-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 20px;
            width: 100%;
            box-sizing: border-box;
        }
        
        .img-preview-card {
            background: #110d24; 
            border-radius: 12px; 
            padding: 16px; 
            border: 1px solid rgba(255,255,255,0.05);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 🎯 核心修改：后台图片显示区统一，工整平铺不拉伸 */
        .img-container { 
            width: 100%; 
            height: 120px; 
            border-radius: 8px; 
            overflow: hidden; 
            background: #090616;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .img-container img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover;
        }

        /* 🎯 精细化表单内部输入框规范加固，防止在移动端撑坏网格 */
        .img-preview-card input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
        }
        .img-preview-card input[type="text"]:focus {
            border-color: var(--accent-neon);
        }
        
        .badge {
            font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; display: inline-block;
            background: rgba(255,255,255,0.06); color: var(--text-muted);
        }

        /* 📱 移动端自适应硬核支撑 */
        @media (max-width: 768px) {
            .image-flow-grid {
                grid-template-columns: 1fr !important; /* 移动端降级为单列垂直排列，绝不横向溢出 */
                gap: 14px;
            }
            .img-container {
                height: 140px;
            }
        }

        @media (min-width: 600px) {
            body { padding: 40px 20px; }
            .container { padding: 35px; border-radius: 24px; }
            .header-box { flex-direction: row; justify-content: space-between; align-items: center; }
            h1 { font-size: 1.6rem; }
            .upload-card { padding: 25px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-box">
            <h1>内容管理后台 —— 终极自适应控制台</h1>
            <a href="index.html" class="back-home-btn">← 返回站点主页</a>
        </div>

        <div class="upload-card">
            <h2><span>🔮</span> 首页大图轮播批量上传缓冲区</h2>
            <div style="margin-bottom: 16px;">
                <label style="display:block; margin-bottom:8px; font-size:0.85rem; color:var(--text-muted);">当前工作模式：首页大图批量推送位</label>
                <select id="page-section" disabled>
                    <option value="section_banner">首页Banner大图轮播 (5张联动区)</option>
                </select>
            </div>

            <div class="dropzone-area" id="drop-zone">
                <span style="font-size:2.2rem; display:block; margin-bottom:8px;">📥</span>
                <span class="dropzone-text">点击批量选择相册大图文件进行缓冲覆盖</span>
                <input type="file" id="file-input" accept="image/*" multiple />
            </div>

            <button id="upload-btn" class="action-btn" disabled>确认部署至下发大图轮播位</button>
            <div id="upload-status" class="status-info">正在安全连接控制中心...</div>
        </div>

        <div class="preview-dashboard">
            <h2><span>🖼️</span> 线上复合内容控制面板 (支持多项编辑与独立多图发布)</h2>
            <div id="sections-wrapper"></div>
        </div>
    </div>

<script>
    window.supabaseClient = null;
    let selectedFilesCache = []; 

    async function initWorkflow() {
        try {
            const SUPABASE_URL = "https://kogjjfccyncdszuuwlun.supabase.co";
            const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtvZ2pqZmNjeW5jZHN6dXV3bHVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4ODEwMDksImV4cCI6MjA5MDQ1NzAwOX0.JIjUQdbZYUM6Cu57pFVwVzrlTrvyYmFyE9eBRlR9Sec";
            
            window.supabaseClient = supabase.createClient(SUPABASE_URL, ANON_KEY, {
                auth: { persistSession: true, autoRefreshToken: true }
            });
            
            const session = await verifyAdminAuth();
            if (!session) return; 

            showStatus('✨ 通信链路已就绪。欢迎回来，管理员！', 'info');
            
            activateUploadListener(SUPABASE_URL);
            await refreshLiveDashboard(SUPABASE_URL);

        } catch (error) {
            console.error(error);
            showStatus('数据引擎对接断开，请刷新重试。', 'error');
        }
    }

    async function verifyAdminAuth() {
        if (!window.supabaseClient) return null;
        const { data: { session }, error } = await window.supabaseClient.auth.getSession();

        if (error || !session) {
            alert('错误：未检测到合法的登录状态！请在主页登录。');
            window.location.href = 'index.html';
            return null;
        }

        const { data: userPermission, error: dbError } = await window.supabaseClient
            .from('users')
            .select('is_admin')
            .eq('email', session.user.email)
            .maybeSingle();

        if (dbError || !userPermission || userPermission.is_admin !== true) {
            alert(`鉴权失败：账号 ${session.user.email} 无控制台访问特权。`);
            window.location.href = 'index.html';
            return null;
        }
        return session;
    }

    // 针对顶部首页大图 5 张图的高保真批量处理
    function activateUploadListener(supabaseUrl) {
        const uploadBtn = document.getElementById('upload-btn');
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');

        uploadBtn.disabled = false;

        fileInput.addEventListener('change', () => {
            selectedFilesCache = Array.from(fileInput.files);
            if (selectedFilesCache.length > 0) {
                dropZone.querySelector('.dropzone-text').innerHTML = `已选中 <em style="color:#2ed573; font-weight:bold;">${selectedFilesCache.length}</em> 张图片，准备覆盖大图轮播。`;
            }
        });

        uploadBtn.addEventListener('click', async () => {
            if (selectedFilesCache.length === 0) {
                alert('请先选取相册图片！');
                return;
            }

            showStatus(`⚡ 正在为首页大图进行并发覆盖同步...`, 'info');

            try {
                const maxCount = Math.min(selectedFilesCache.length, 5);
                for (let i = 0; i < maxCount; i++) {
                    const file = selectedFilesCache[i];
                    const fileName = `section_banner_${i}.png`; 
                    
                    await window.supabaseClient.storage
                        .from('images')
                        .upload(`images/${fileName}`, file, { upsert: true });

                    const storageUrl = `${supabaseUrl}/storage/v1/object/public/images/images/${fileName}`;

                    await window.supabaseClient
                        .from('deployed_images')
                        .upsert({
                            section_id: 'section_banner',
                            image_index: i,
                            storage_url: storageUrl,
                            updated_at: new Date().toISOString()
                        }, { onConflict: 'section_id,image_index' });
                }

                showStatus('🎉 首页5张大图轮播图部署下发成功！', 'success');
                selectedFilesCache = [];
                fileInput.value = '';
                dropZone.querySelector('.dropzone-text').innerHTML = '点击批量选择相册大图文件进行缓冲覆盖';
                
                await refreshLiveDashboard(supabaseUrl);

            } catch (err) {
                showStatus('上传流发生阻断: ' + err.message, 'error');
            }
        });
    }

    // ========================================================
    // 🎯 动态渲染：热门动漫、漫画连载输入框与双轨上传大卡片
    // ========================================================
    async function refreshLiveDashboard(supabaseUrl) {
        const wrapper = document.getElementById('sections-wrapper');
        if (!wrapper) return;
        wrapper.innerHTML = '';

        // 1. 同步拉取精细化内容配置表
        let managementData = [];
        try {
            const { data, error } = await window.supabaseClient.from('content_management').select('*');
            if (data && !error) managementData = data;
        } catch (err) { console.error(err); }

        // 2. 拉取大图轮播表数据
        let bannerList = [];
        try {
            const { data } = await window.supabaseClient.from('deployed_images').select('*').eq('section_id', 'section_banner');
            if (data) bannerList = data;
        } catch(e){}

        const modules = [
            { id: 'section_banner', name: '🎪 首页 5 张大图轮播位监控', type: 'banner', maxCount: 5 },
            { id: 'anime', name: '📺 热门动漫推荐专区 (支持精细化详情图上传)', type: 'content', maxCount: 4 },
            { id: 'manga', name: '📖 漫画连载专区 (支持连载主题添加)', type: 'content', maxCount: 4 }
        ];

        for (const mod of modules) {
            const block = document.createElement('div');
            block.className = 'dashboard-section';
            block.style = "background:var(--panel-bg); border:1px solid var(--border-glow); border-radius:16px; padding:20px; margin-bottom:24px; box-sizing:border-box;";

            block.innerHTML = `<div class="section-title" style="font-size:1.1rem; font-weight:bold; color:var(--accent-neon); margin-bottom:16px;">${mod.name}</div>`;
            const grid = document.createElement('div');
            grid.className = 'image-flow-grid';

            // 情况 A：首页大图轮播位
            if (mod.type === 'banner') {
                for (let i = 0; i < mod.maxCount; i++) {
                    const card = document.createElement('div');
                    card.className = 'img-preview-card';
                    const match = bannerList.find(b => b.image_index === i);
                    const cacheBuster = `?t=${new Date().getTime()}`;

                    if (match) {
                        card.innerHTML = `
                            <div class="img-container"><img src="${match.storage_url}${cacheBuster}" /></div>
                            <div style="display:flex; justify-content:space-between; margin-top:4px; align-items:center;">
                                <span class="badge" style="background:#2ecc71; color:#fff;">● 已上线 [大图 ${i+1}]</span>
                            </div>
                        `;
                    } else {
                        card.innerHTML = `
                            <div class="img-container" style="color:var(--text-muted); font-size:0.8rem;">📷 轮播位空缺 [${i+1}]</div>
                            <span class="badge">未上架</span>
                        `;
                    }
                    grid.appendChild(card);
                }
                block.appendChild(grid);
                
                const btnWrap = document.createElement('div');
                btnWrap.style = "margin-top:16px; text-align:right;";
                btnWrap.innerHTML = `<button class="deploy-btn" onclick="deploySection('section_banner', 5, '${supabaseUrl}')">🚀 激活激活同步发布</button>`;
                block.appendChild(btnWrap);
            } 
            
            // 情况 B：热门动漫推荐 / 漫画连载（修复无遮挡、带输入框、独立文件选择器版本）
            else {
                for (let i = 0; i < mod.maxCount; i++) {
                    const card = document.createElement('div');
                    card.className = 'img-preview-card';

                    const record = managementData.find(d => d.category === mod.id && d.slot_index === i) || {
                        title: '', subtitle: '', theme_tags: [], cover_url: '', detail_urls: []
                    };

                    const hasCover = !!record.cover_url;
                    const cacheBuster = `?t=${new Date().getTime()}`;

                    card.innerHTML = `
                        <div style="font-size:0.85rem; font-weight:bold; color:#fff;">🖼️ 首页封面展示 (格子 ${i+1})</div>
                        <div class="img-container">
                            ${hasCover ? `<img src="${record.cover_url}${cacheBuster}" />` : `<span style="font-size:0.8rem; color:var(--text-muted);">📷 暂无封面，请上传</span>`}
                        </div>
                        
                        <div style="background:rgba(255,255,255,0.03); padding:6px; border-radius:6px; border:1px dashed rgba(255,255,255,0.12);">
                            <div style="font-size:0.7rem; color:var(--text-muted); margin-bottom:2px;">📁 选择主封面图</div>
                            <input type="file" id="cover-file-${mod.id}-${i}" accept="image/*" style="font-size:0.75rem; color:#fff; width:100%;" />
                        </div>

                        <div style="display:flex; flex-direction:column; gap:6px;">
                            <div>
                                <label style="font-size:0.7rem; color:var(--text-muted); display:block; margin-bottom:2px;">📌 主标题名称</label>
                                <input type="text" id="title-${mod.id}-${i}" value="${record.title || ''}" placeholder="如：名侦探柯南" />
                            </div>
                            <div>
                                <label style="font-size:0.7rem; color:var(--text-muted); display:block; margin-bottom:2px;">🎬 连载副标题/更新集数</label>
                                <input type="text" id="sub-${mod.id}-${i}" value="${record.subtitle || ''}" placeholder="如：更新至 1120 话" />
                            </div>
                            <div>
                                <label style="font-size:0.7rem; color:var(--text-muted); display:block; margin-bottom:2px;">🏷️ 添加连载主题主题 (逗号隔开)</label>
                                <input type="text" id="tags-${mod.id}-${i}" value="${(record.theme_tags || []).join(',')}" placeholder="如：悬疑,推理,热血" />
                            </div>
                        </div>

                        <div style="background:rgba(0,0,0,0.3); padding:8px; border-radius:6px; margin-top:4px;">
                            <div style="font-size:0.75rem; color:var(--accent-neon); margin-bottom:4px; font-weight:bold;">📂 详情页正文图集 (已传: ${(record.detail_urls || []).length} 张)</div>
                            <input type="file" id="files-detail-${mod.id}-${i}" multiple accept="image/*" style="font-size:0.75rem; color:var(--text-muted); width:100%;" />
                        </div>

                        <button onclick="saveContentModule('${mod.id}', ${i}, '${supabaseUrl}')" style="width:100%; margin-top:auto; background:linear-gradient(135deg, #00f5ff 0%, #0055ff 100%); color:#000; font-weight:bold; border:none; padding:8px; border-radius:6px; cursor:pointer; font-size:0.85rem;">
                            💾 保存配置并同步发布
                        </button>
                    `;
                    grid.appendChild(card);
                }
                block.appendChild(grid);
            }
            wrapper.appendChild(block);
        }
    }

    // ========================================================
    // 🎯 核心上传存储引擎：双轨同步分流
    // ========================================================
    window.saveContentModule = async function(category, slotIndex, supabaseUrl) {
        const titleVal = document.getElementById(`title-${category}-${slotIndex}`).value.trim();
        const subtitleVal = document.getElementById(`sub-${category}-${slotIndex}`).value.trim();
        const tagsRaw = document.getElementById(`tags-${category}-${slotIndex}`).value.trim();
        const themeTags = tagsRaw ? tagsRaw.split(/[，,]/).map(t => t.trim()).filter(Boolean) : [];

        const coverInput = document.getElementById(`cover-file-${category}-${slotIndex}`);
        const detailInput = document.getElementById(`files-detail-${category}-${slotIndex}`);
        
        try {
            showStatus(`正在部署下发格 [${slotIndex + 1}] ...`, 'info');

            // 1. 上传独立主封面
            let coverUrl = "";
            if (coverInput && coverInput.files.length > 0) {
                const cFile = coverInput.files[0];
                const cName = `${category}_slot_${slotIndex}_cover_${Date.now()}.png`;
                
                const { error: errC } = await window.supabaseClient.storage.from('images').upload(`images/${cName}`, cFile, { upsert: true });
                if (errC) throw new Error("主封面同步失败: " + errC.message);
                
                coverUrl = `${supabaseUrl}/storage/v1/object/public/images/images/${cName}`;
            } else {
                const { data } = await window.supabaseClient.from('content_management').select('cover_url').eq('category', category).eq('slot_index', slotIndex).single();
                if (data) coverUrl = data.cover_url;
            }

            // 2. 上传详情页内容图集（不限制张数批量并发）
            let detailUrls = [];
            if (detailInput && detailInput.files.length > 0) {
                const files = detailInput.files;
                for (let k = 0; k < files.length; k++) {
                    const dFile = files[k];
                    const dName = `${category}_slot_${slotIndex}_detail_${k}_${Date.now()}.png`;
                    
                    const { error: errD } = await window.supabaseClient.storage.from('images').upload(`images/${dName}`, dFile, { upsert: true });
                    if (!errD) {
                        const dUrl = `${supabaseUrl}/storage/v1/object/public/images/images/${dName}`;
                        detailUrls.push(dUrl);
                    }
                }
            } else {
                const { data } = await window.supabaseClient.from('content_management').select('detail_urls').eq('category', category).eq('slot_index', slotIndex).single();
                if (data && data.detail_urls) detailUrls = data.detail_urls;
            }

            // 3. 压入精细化配置大表
            const { error } = await window.supabaseClient
                .from('content_management')
                .upsert({
                    category: category,
                    slot_index: slotIndex,
                    title: titleVal,
                    subtitle: subtitleVal,
                    theme_tags: themeTags,
                    cover_url: coverUrl,
                    detail_urls: detailUrls,
                    updated_at: new Date().toISOString()
                }, { onConflict: 'category,slot_index' });

            if (error) throw error;

            alert('✨ 该卡片配置及图集已全部同步部署上架！');
            showStatus('🎉 同步下发成功！', 'success');
            await refreshLiveDashboard(supabaseUrl);

        } catch (err) {
            console.error(err);
            alert('发布失败: ' + err.message);
        }
    };

    window.deploySection = async function(section, maxCount, supabaseUrl) {
        let deployedUrls = [];
        for (let i = 0; i < maxCount; i++) {
            const liveUrl = `${supabaseUrl}/storage/v1/object/public/images/images/${section}_${i}.png`;
            deployedUrls.push(`${liveUrl}?t=${new Date().getTime()}`);
        }

        try {
            showStatus(`正在下发 [${section}] 部署指令...`, 'info');
            const { error } = await window.supabaseClient
                .from('site_config')
                .upsert([{ section: section, url: JSON.stringify(deployedUrls) }]);

            if (error) throw error;
            alert('✨ 首页大图轮播已经安全激活上线！');
            showStatus('🎉 部署成功！', 'success');
        } catch (err) {
            alert('部署失败: ' + err.message);
        }
    };

    function showStatus(msg, type) {
        const el = document.getElementById('upload-status');
        if (!el) return;
        el.innerText = msg;
        el.className = ''; 
        if (type === 'info') el.className = 'status-info';
        if (type === 'success') el.className = 'status-success';
        if (type === 'error') el.className = 'status-error';
    }

    document.addEventListener('DOMContentLoaded', initWorkflow);
</script>
</body>
</html>
