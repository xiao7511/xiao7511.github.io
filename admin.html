<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>内容管理后台 —— 终极自适应控制台</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c20 0%, #15102a 100%);
            --panel-bg: rgba(25, 20, 45, 0.75);
            --border-glow: rgba(138, 43, 226, 0.25);
            --primary-glow: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            --accent-neon: #00f5ff;
            --text-main: #f1f2f6;
            --text-muted: #a4b0be;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: auto;
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-glow);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        .header-box {
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: flex-start;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.3rem;
            margin: 0;
            font-weight: 800;
            background: linear-gradient(120deg, #ffffff, var(--accent-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .back-home-btn {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main) !important;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-decoration: none !important;
            transition: all 0.2s;
        }
        .back-home-btn:hover { background: var(--primary-glow); border-color: transparent; }
        .back-arrow { margin-right: 6px; }

        .upload-card {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-sizing: border-box;
        }

        h2 {
            font-size: 1.05rem;
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        select {
            width: 100%;
            background: #1c1836;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px; 
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            box-sizing: border-box;
        }

        .dropzone-area {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            margin: 16px 0;
            box-sizing: border-box;
        }
        .dropzone-area:active {
            border-color: var(--accent-neon);
            background: rgba(0, 245, 255, 0.04);
        }

        input[type='file'] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
            z-index: 5;
        }

        .action-btn {
            width: 100%;
            background: var(--primary-glow);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(106, 17, 203, 0.3);
            transition: opacity 0.2s;
        }
        .action-btn:active { opacity: 0.8; }
        .action-btn:disabled { background: #2e2a44; color: var(--text-muted); cursor: not-allowed; box-shadow: none; }

        #upload-status {
            margin-top: 14px; padding: 12px; border-radius: 8px;
            font-size: 0.85rem; text-align: center; line-height: 1.4;
        }
        .status-info { background: rgba(37, 117, 252, 0.15); color: #3a86ff; }
        .status-success { background: rgba(46, 213, 115, 0.15); color: #2ed573; }
        .status-error { background: rgba(255, 71, 87, 0.15); color: #ff4757; }

        .preview-dashboard { margin-top: 32px; }
        
        .dashboard-section {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 20px;
        }
        
        .section-header {
            display: flex; 
            flex-direction: row; 
            justify-content: space-between; 
            align-items: center;
            margin-bottom: 14px; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            padding-bottom: 10px;
            gap: 10px;
        }
        
        .section-title { font-weight: 700; color: var(--accent-neon); font-size: 0.95rem; }
        
        .deploy-btn {
            background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
            color: white; border: none; padding: 8px 14px; border-radius: 6px;
            font-weight: 600; cursor: pointer; font-size: 0.8rem;
            white-space: nowrap;
            box-shadow: 0 4px 8px rgba(0, 206, 201, 0.2);
        }

            display: grid; 
            grid-template-columns: repeat(2, 1fr);

            justify-content: center;
        }
        .img-container img {

            object-fit: contain;
        }*/
        /* 🎯 优化：PC端满屏、大图平铺，移动端保持自适应 */
        .image-flow-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); /* PC端格子自动变宽撑满 */
            gap: 16px;
            margin-top: 12px;
        }

        .img-preview-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 10px;
            transition: all 0.3s ease;
        }

        .img-container {
            width: 100%;
            height: 180px; /* 💡 从原本的 90px 提高到 180px，给大屏充足的展示空间 */
            background: #090616;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 🎯 核心改变：撑满容器且不变形，实现完美的“满屏平铺”视觉 */
        }

        /* 移动端特殊保护：如果屏幕小于 768px，保持原本紧凑好看的高度 */
        @media (max-width: 768px) {
            .image-flow-grid {
                grid-template-columns: repeat(2, 1fr); /* 移动端保持一行两张图 */
                gap: 8px;
            }
            .img-container {
                height: 100px; 
            }
        }
        
        .badge {
            font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 6px;
            background: rgba(255,255,255,0.06); color: var(--text-muted);
        }

        @media (min-width: 600px) {
            body { padding: 40px 20px; }
            .container { padding: 35px; border-radius: 24px; }
            .header-box { flex-direction: row; justify-content: space-between; align-items: center; }
            h1 { font-size: 1.6rem; }
            h2 { font-size: 1.2rem; }
            .upload-card { padding: 25px; }
            .dropzone-area { padding: 35px 20px; }
            .image-flow-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
            .img-container { height: 90px; }
            .badge { font-size: 0.75rem; }
            .section-title { font-size: 1.05rem; }
            .deploy-btn { font-size: 0.85rem; padding: 8px 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-box">
            <h1>内容管理后台 —— 终极自适应控制台</h1>
            <a href="index.html" class="back-home-btn"><span class="back-arrow">←</span> 返回站点主页</a>
        </div>

        <div class="upload-card">
            <h2><span>🔮</span> 批量上传文件 (手机端支持多选/拍照)</h2>
            
            <div style="margin-bottom: 16px;">
                <label style="display:block; margin-bottom:8px; font-size:0.85rem; color:var(--text-muted);">目标更新版面</label>
                <select id="page-section">
                    <option value="section_banner">首页Banner大图轮播</option>
                    <option value="section_anime">动漫版面多图轮播</option>
                    <option value="section_community">社区交流多图轮播</option>
                    <option value="section_recommend">热门强推多图轮播</option>
                </select>
            </div>

            <div class="dropzone-area" id="drop-zone">
                <span style="font-size:2.2rem; display:block; margin-bottom:8px;">📥</span>
                <span class="dropzone-text">点击批量选择相册文件或拍照</span>
                <input type="file" id="file-input" accept="image/*" multiple />
            </div>

            <button id="upload-btn" class="action-btn" disabled>确认上传至下方预览库</button>
            <div id="upload-status" class="status-info" style="display: block;">正在安全连接控制中心...</div>
        </div>

        <div class="preview-dashboard">
            <h2><span>🖼️</span> 线上运行与待部署图库看板 (先预览，后部署)</h2>
            <div id="sections-wrapper"></div>
        </div>
    </div>

    async function initWorkflow() {
        try {
            const SUPABASE_URL = "https://kogjjfccyncdszuuwlun.supabase.co";
            const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtvZ2pqZmNjeW5jZHN6dXV3bHVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4ODEwMDksImV4cCI6MjA5MDQ1NzAwOX0.JIjUQdbZYUM6Cu57pFVwVzrlTrvyYmFyE9eBRlR9Sec";
            
            window.supabaseClient = supabase.createClient(SUPABASE_URL, ANON_KEY, {

                    persistSession: true,

                }
            });
            
            const session = await verifyAdminAuth();

    async function verifyAdminAuth() {
        if (!window.supabaseClient) return null;
        const { data: { session }, error } = await window.supabaseClient.auth.getSession();

        if (error || !session) {
            alert('错误：未检测到合法的登录状态！请在主页登录。');
            window.location.href = 'index.html';
            return null;
        }

        const { data: userPermission, error: dbError } = await window.supabaseClient
            .from('users')
            .select('is_admin')
            .eq('email', session.user.email)
            .maybeSingle();

        if (dbError || !userPermission || userPermission.is_admin !== true) {
            alert(`鉴权失败：账号 ${session.user.email} 无控制台访问特权。`);
            window.location.href = 'index.html';
            return null;
        }
        
        return session;
    }

    function activateUploadListener(supabaseUrl) {
        const uploadBtn = document.getElementById('upload-btn');
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');

        uploadBtn.disabled = false;

        fileInput.addEventListener('change', () => {
            selectedFilesCache = Array.from(fileInput.files);
            if (selectedFilesCache.length > 0) {
                dropZone.querySelector('.dropzone-text').innerHTML = `已选中 <em style="color:#2ed573; font-weight:bold;">${selectedFilesCache.length}</em> 张图片，准备就绪。`;
            }
        });

        uploadBtn.addEventListener('click', async () => {
            if (selectedFilesCache.length === 0) {
                alert('请先拍照或选取相册图片！');
                return;
            }

            const section = document.getElementById('page-section').value;
            showStatus(`⚡ 正在并发上传 ${selectedFilesCache.length} 张图片到云仓预览缓冲区...`, 'info');

            try {
                for (let i = 0; i < selectedFilesCache.length; i++) {
                    const file = selectedFilesCache[i];
                    const fileName = `${section}_${i}.png`; 
                    
                    // 1. 强力并发推送至云仓 Storage，开启覆盖写入机制
                    const { error: storageError } = await window.supabaseClient.storage
                        .from('images')
                        .upload(`images/${fileName}`, file, { upsert: true });

                    if (storageError) {
                        alert(`索引 [${i}] 存储桶上传失败: ${storageError.message}`);
                        continue;
                    }

                    // 2. 拼接公开的线上大图 URL
                    const storageUrl = `${supabaseUrl}/storage/v1/object/public/images/images/${fileName}`;

                    // 3. 🎯 核心解决：同步写入 deployed_images 表
                    await window.supabaseClient
                        .from('deployed_images')
                        .upsert({
                            section_id: section,
                            image_index: i,
                            storage_url: storageUrl,
                            updated_at: new Date().toISOString()
                        }, { onConflict: 'section_id,image_index' });

                    // 4. 🎯 核心解决：带上强制毫秒时间戳击穿浏览器缓存，实时点亮单张预览
                    const targetImg = document.getElementById(`img-${section}-${i}`);
                    const targetCard = document.getElementById(`card-${section}-${i}`);
                    
                    if (targetCard) {
                        targetCard.style.display = 'block';
                        // 如果原本是席位空缺，则需要动态生成里面的图片结构
                        targetCard.innerHTML = `
                            <div class="img-container">
                                <img id="img-${section}-${i}" src="${storageUrl}?t=${new Date().getTime()}" />
                            </div>
                            <span class="badge" style="background:#2ecc71; color:#fff;">● 已上线 [索引 ${i}]</span>
                        `;
                    }
                }

                showStatus('🎉 预览库更新成功！请在下方核对多图，核对无误后点击“一键部署”。', 'success');
                selectedFilesCache = [];
                fileInput.value = '';
                dropZone.querySelector('.dropzone-text').innerHTML = '点击批量选择相册文件或拍照';
                
                // 5. 最终全量重新查表校验渲染，确保看板万无一失地刷新
                await refreshLiveDashboard(supabaseUrl);

            } catch (err) {
                showStatus('上传流发生阻断: ' + err.message, 'error');
            }
        });
    }

    // ==========================================
    // 🎯 加固版：提交成功后全量刷新预览
    // ==========================================
    async function handleImageUploadSuccess(sectionId, index, storageUrl, supabaseUrl) {
        console.log(`图片上传成功，正在同步路由表... 位置: ${sectionId}_${index}`);

        try {
            // 1. 同步更新路由表
            await window.supabaseClient
                .from('deployed_images')
                .upsert({
                    section_id: sectionId,
                    image_index: index,
                    storage_url: storageUrl,
                    updated_at: new Date().toISOString()
                }, { onConflict: 'section_id,image_index' });

            console.log("路由表同步成功，正在击穿缓存强刷预览区...");

            // 2. 🎯 精准修改：尝试击穿缓存修改单张 DOM
            const targetImg = document.getElementById(`img-${sectionId}-${index}`);
            const targetCard = document.getElementById(`card-${sectionId}-${index}`);

            if (targetImg && targetCard) {
                targetImg.src = `${storageUrl}?t=${new Date().getTime()}`;
                targetCard.style.display = 'block';
                const badge = targetCard.querySelector('.badge');
                if (badge) {
                    badge.className = 'badge active';
                    badge.style.backgroundColor = '#2ecc71';
                    badge.textContent = `● 已上线 [索引 ${index}]`;
                }
            }
            
            // 3. 🎯 终极保底：无论上面 DOM 有没有抓到，直接调用查表函数，让看板重新渲染
            if (typeof refreshLiveDashboard === 'function') {
                await refreshLiveDashboard(supabaseUrl);
            }

            alert('照片提交成功，预览图已同步刷新！');

        } catch (err) {
            console.error("提交后处理预览失败:", err);
            alert('图片已上传，但动态预览刷新失败，请手动刷新页面。');
        }
    }

    // ========================================================
    // 🎯 全新业务看板：支持标题、连载标题、主题标签及不限张数详情图上传
    // ========================================================
    async function refreshLiveDashboard(supabaseUrl) {
        const wrapper = document.getElementById('sections-wrapper');
        if (!wrapper) return;
        wrapper.innerHTML = '';

        // 1. 同步拉取新建立的内容配置表数据
        let managementData = [];
        try {
            const { data, error } = await window.supabaseClient.from('content_management').select('*');
            if (data && !error) managementData = data;
        } catch (err) { console.error(err); }

        // 2. 拉取旧的 banner 路由数据
        let bannerList = [];
        try {
            const { data } = await window.supabaseClient.from('deployed_images').select('*').eq('section_id', 'section_banner');
            if (data) bannerList = data;
        } catch(e){}

        // 定义咱们全新的三大核心管理区域
        const modules = [
            { id: 'section_banner', name: '🎪 首页 5 张大图轮播区', type: 'banner', maxCount: 5 },
            { id: 'anime', name: '📺 热门动漫推荐区 (首页预览 + 详情配置)', type: 'content', maxCount: 4 },
            { id: 'manga', name: '📖 漫画连载专区 (首页预览 + 连载主题配置)', type: 'content', maxCount: 4 }
        ];

        for (const mod of modules) {
            const block = document.createElement('div');
            block.className = 'dashboard-section';
            block.style = "background:var(--panel-bg); border:1px solid var(--border-glow); border-radius:16px; padding:20px; margin-bottom:24px;";

            block.innerHTML = `<div class="section-title" style="font-size:1.2rem; font-weight:bold; color:var(--accent-neon); margin-bottom:16px;">${mod.name}</div>`;
            const grid = document.createElement('div');
            grid.className = 'image-flow-grid';

            // 🔹 情况 A：如果是首页大图轮播，保持原功能不变（5张图上限）
            if (mod.type === 'banner') {
                for (let i = 0; i < mod.maxCount; i++) {
                    const card = document.createElement('div');
                    card.className = 'img-preview-card';
                    const match = bannerList.find(b => b.image_index === i);
                    const cacheBuster = `?t=${new Date().getTime()}`;

                    if (match) {
                        card.innerHTML = `
                            <div class="img-container"><img src="${match.storage_url}${cacheBuster}" /></div>
                            <div style="display:flex; justify-content:space-between; margin-top:8px;">
                                <span class="badge" style="background:#2ecc71; color:#fff;">● 轮播图 [${i+1}]</span>
                                <button onclick="deleteImage('section_banner', ${i}, '${supabaseUrl}')" style="background:#ff4757; color:#fff; border:none; padding:2px 6px; border-radius:4px; cursor:pointer; font-size:0.7rem;">❌ 删除</button>
                            </div>
                        `;
                    } else {
                        card.innerHTML = `
                            <div class="img-container" style="color:var(--text-muted); font-size:0.8rem;">📷 轮播位空缺 [${i+1}]</div>
                            <span class="badge" style="margin-top:8px;">未部署</span>
                        `;
                    }
                    grid.appendChild(card);
                }
                block.appendChild(grid);
                // 增加一键部署按钮
                const btnWrap = document.createElement('div');
                btnWrap.style = "margin-top:16px; text-align:right;";
                btnWrap.innerHTML = `<button class="deploy-btn" onclick="deploySection('section_banner', 5, '${supabaseUrl}')">🚀 一键部署大图轮播</button>`;
                block.appendChild(btnWrap);
            } 
            
            // 🔹 情况 B：热门动漫推荐与漫画连载（复合新需求）
            else {
                for (let i = 0; i < mod.maxCount; i++) {
                    const card = document.createElement('div');
                    card.className = 'img-preview-card';
                    card.style = "background:rgba(0,0,0,0.2); padding:14px; border-radius:10px;";

                    const record = managementData.find(d => d.category === mod.id && d.slot_index === i) || {
                        title: mod.id === 'anime' ? '未命名动漫' : '未命名漫画',
                        subtitle: '连载更新至第 1 话',
                        theme_tags: [],
                        cover_url: '',
                        detail_urls: []
                    };

                    const hasCover = !!record.cover_url;
                    const cacheBuster = `?t=${new Date().getTime()}`;

                    card.innerHTML = `
                        <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:4px;">🖼️ 首页展示封面 [格子 ${i+1}]</div>
                        <div class="img-container" style="height:130px;">
                            ${hasCover ? `<img src="${record.cover_url}${cacheBuster}" />` : `<span style="font-size:0.8rem; color:#666;">📷 暂无封面(点击下方一键部署上传)</span>`}
                        </div>

                        <div style="margin-top:10px; display:flex; flex-direction:column; gap:6px;">
                            <input type="text" id="title-${mod.id}-${i}" value="${record.title}" placeholder="修改主标题名称..." style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:#fff; padding:4px 8px; border-radius:4px; font-size:0.85rem;" />
                            <input type="text" id="sub-${mod.id}-${i}" value="${record.subtitle}" placeholder="修改连载标题/章节..." style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:#var(--accent-neon); padding:4px 8px; border-radius:4px; font-size:0.8rem;" />
                            <input type="text" id="tags-${mod.id}-${i}" value="${(record.theme_tags || []).join('，')}" placeholder="添加连载主题(用，逗号隔开)..." style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:#ffe066; padding:4px 8px; border-radius:4px; font-size:0.8rem;" />
                        </div>

                        <div style="margin-top:12px; background:rgba(0,0,0,0.3); padding:8px; border-radius:6px;">
                            <div style="font-size:0.75rem; color:rgba(255,255,255,0.5); margin-bottom:4px;">📂 详情页大图集 (已传: ${ (record.detail_urls || []).length } 张)</div>
                            <input type="file" id="files-detail-${mod.id}-${i}" multiple accept="image/*" style="font-size:0.7rem; width:100%; color:var(--text-muted);" />
                        </div>

                        <button onclick="saveContentModule('${mod.id}', ${i}, '${supabaseUrl}')" style="width:100%; margin-top:12px; background:linear-gradient(135deg, #00f5ff 0%, #0055ff 100%); color:#000; font-weight:bold; border:none; padding:6px; border-radius:6px; cursor:pointer; font-size:0.8rem;">💾 保存配置并同步部署</button>
                    `;
                    grid.appendChild(card);
                }
                block.appendChild(grid);
            }
            wrapper.appendChild(block);
        }
    }

    window.deploySection = async function(section, maxCount, supabaseUrl) {
        let deployedUrls = [];
        for (let i = 0; i < maxCount; i++) {
            const liveUrl = `${supabaseUrl}/storage/v1/object/public/images/images/${section}_${i}.png`;
            deployedUrls.push(`${liveUrl}?t=${new Date().getTime()}`);
        }

        try {
            showStatus(`正在下发 [${section}] 的部署指令...`, 'info');
            
            const { error } = await window.supabaseClient
                .from('site_config')
                .upsert([{ section: section, url: JSON.stringify(deployedUrls) }]);

            if (error) throw error;
            
            alert('✨ 部署指令已安全同步！主页相应版面多图轮播已实时覆盖。');
            showStatus('🎉 部署成功！前台数据流已刷新。', 'success');

        } catch (err) {
            alert('部署同步失败: ' + err.message);
            showStatus('部署失败: ' + err.message, 'error');
        }
    };

    function showStatus(msg, type) {
        const el = document.getElementById('upload-status');
        if (!el) return;
        el.style.display = 'block'; 
        el.innerText = msg;
        el.className = ''; 
        if (type === 'info') el.className = 'status-info';
        if (type === 'success') el.className = 'status-success';
        if (type === 'error') el.className = 'status-error';
    }
    // 🎯 核心优化：单张图片路由安全退线与清除机制
    window.deleteImage = async function(sectionId, index, supabaseUrl) {
        if (!confirm(`确定要将当前版面 [${sectionId}] 的第 ${index + 1} 张图片退线并清除预览吗？`)) {
            return;
        }

        try {
            showStatus(`正在注销路由记录... [位置: ${sectionId}_${index}]`, 'info');

            // 1. 从 deployed_images 路由表中彻底抹去这一行记录
            const { error: dbError } = await window.supabaseClient
                .from('deployed_images')
                .delete()
                .eq('section_id', sectionId)
                .eq('image_index', index);

            if (dbError) throw dbError;

            // 2. 刷新画布看板，使其立刻无缝变为 “📷 席位空缺”
            await refreshLiveDashboard(supabaseUrl);
            showStatus('🎉 单图注销成功！请在核对无误后重新点击“一键部署”刷新前台。', 'success');
            alert('图片已成功在预览库下线！温馨提示：请记得点击对应区域的“一键部署”按钮，将删除后的最新空缺状态同步发布到前台。');

        } catch (err) {
            console.error("图片注销失败:", err);
            alert('删除路由失败: ' + err.message);
        }
    };
    document.addEventListener('DOMContentLoaded', initWorkflow);


</script>
</body>
</html>
