<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>内容管理后台 —— 终极自适应控制台</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c20 0%, #15102a 100%);
            --panel-bg: rgba(25, 20, 45, 0.75);
            --border-glow: rgba(138, 43, 226, 0.25);
            --primary-glow: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            --accent-neon: #00f5ff;
            --text-main: #f1f2f6;
            --text-muted: #a4b0be;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: auto;
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-glow);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        .header-box {
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: flex-start;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.3rem;
            margin: 0;
            font-weight: 800;
            background: linear-gradient(120deg, #ffffff, var(--accent-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .back-home-btn {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main) !important;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-decoration: none !important;
            transition: all 0.2s;
        }
        .back-home-btn:hover { background: var(--primary-glow); border-color: transparent; }
        .back-arrow { margin-right: 6px; }

        .upload-card {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-sizing: border-box;
        }

        h2 {
            font-size: 1.05rem;
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        select {
            width: 100%;
            background: #1c1836;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px; 
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            box-sizing: border-box;
        }

        .dropzone-area {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            margin: 16px 0;
            box-sizing: border-box;
        }
        .dropzone-area:active {
            border-color: var(--accent-neon);
            background: rgba(0, 245, 255, 0.04);
        }

        input[type='file'] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
            z-index: 5;
        }

        .action-btn {
            width: 100%;
            background: var(--primary-glow);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(106, 17, 203, 0.3);
            transition: opacity 0.2s;
        }
        .action-btn:active { opacity: 0.8; }
        .action-btn:disabled { background: #2e2a44; color: var(--text-muted); cursor: not-allowed; box-shadow: none; }

        #upload-status {
            margin-top: 14px; padding: 12px; border-radius: 8px;
            font-size: 0.85rem; text-align: center; line-height: 1.4;
        }
        .status-info { background: rgba(37, 117, 252, 0.15); color: #3a86ff; }
        .status-success { background: rgba(46, 213, 115, 0.15); color: #2ed573; }
        .status-error { background: rgba(255, 71, 87, 0.15); color: #ff4757; }

        .preview-dashboard { margin-top: 32px; }
        
        .dashboard-section {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 20px;
        }
        
        .section-header {
            display: flex; 
            flex-direction: row; 
            justify-content: space-between; 
            align-items: center;
            margin-bottom: 14px; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            padding-bottom: 10px;
            gap: 10px;
        }
        
        .section-title { font-weight: 700; color: var(--accent-neon); font-size: 0.95rem; }
        
        .deploy-btn {
            background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
            color: white; border: none; padding: 8px 14px; border-radius: 6px;
            font-weight: 600; cursor: pointer; font-size: 0.8rem;
            white-space: nowrap;
            box-shadow: 0 4px 8px rgba(0, 206, 201, 0.2);
        }

        .image-flow-grid {
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 10px;
        }
        
        .img-preview-card {
            background: #110d24; border-radius: 8px; padding: 8px; text-align: center;
            border: 1px solid rgba(255,255,255,0.03);
            box-sizing: border-box;
            display: none; /* 💡 默认隐藏，确定有图才显示 */
        }

        .img-container { 
            width: 100%; 
            min-height: 90px; 
            max-height: 180px;
            border-radius: 6px; 
            overflow: hidden; 
            background: #090616;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .img-container img { 
            width: 100%; 
            height: auto; 
            max-height: 180px;
            object-fit: contain;
        }
        
        .badge {
            font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 6px;
            background: rgba(255,255,255,0.06); color: var(--text-muted);
        }

        @media (min-width: 600px) {
            body { padding: 40px 20px; }
            .container { padding: 35px; border-radius: 24px; }
            .header-box { flex-direction: row; justify-content: space-between; align-items: center; }
            h1 { font-size: 1.6rem; }
            h2 { font-size: 1.2rem; }
            .upload-card { padding: 25px; }
            .dropzone-area { padding: 35px 20px; }
            .image-flow-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
            .img-container { height: 90px; }
            .badge { font-size: 0.75rem; }
            .section-title { font-size: 1.05rem; }
            .deploy-btn { font-size: 0.85rem; padding: 8px 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-box">
            <h1>内容管理后台 —— 终极自适应控制台</h1>
            <a href="index.html" class="back-home-btn"><span class="back-arrow">←</span> 返回站点主页</a>
        </div>

        <div class="upload-card">
            <h2><span>🔮</span> 批量上传文件 (手机端支持多选/拍照)</h2>
            
            <div style="margin-bottom: 16px;">
                <label style="display:block; margin-bottom:8px; font-size:0.85rem; color:var(--text-muted);">目标更新版面</label>
                <select id="page-section">
                    <option value="section_banner">首页Banner大图轮播</option>
                    <option value="section_anime">动漫版面多图轮播</option>
                    <option value="section_community">社区交流多图轮播</option>
                    <option value="section_recommend">热门强推多图轮播</option>
                </select>
            </div>

            <div class="dropzone-area" id="drop-zone">
                <span style="font-size:2.2rem; display:block; margin-bottom:8px;">📥</span>
                <span class="dropzone-text">点击批量选择相册文件或拍照</span>
                <input type="file" id="file-input" accept="image/*" multiple />
            </div>

            <button id="upload-btn" class="action-btn" disabled>确认上传至下方预览库</button>
            <div id="upload-status" class="status-info" style="display: block;">正在安全连接控制中心...</div>
        </div>

        <div class="preview-dashboard">
            <h2><span>🖼️</span> 线上运行与待部署图库看板 (先预览，后部署)</h2>
            <div id="sections-wrapper"></div>
        </div>
    </div>

<script>
    window.supabaseClient = null;
    let selectedFilesCache = []; 

    async function initWorkflow() {
        try {
            const SUPABASE_URL = "https://kogjjfccyncdszuuwlun.supabase.co";
            const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtvZ2pqZmNjeW5jZHN6dXV3bHVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4ODEwMDksImV4cCI6MjA5MDQ1NzAwOX0.JIjUQdbZYUM6Cu57pFVwVzrlTrvyYmFyE9eBRlR9Sec";
            
            window.supabaseClient = supabase.createClient(SUPABASE_URL, ANON_KEY, {
                auth: {
                    persistSession: true, 
                    autoRefreshToken: true
                }
            });
            
            const session = await verifyAdminAuth();
            if (!session) return; 

            showStatus('✨ 通信链路已就绪。欢迎回来，管理员！', 'info');
            
            activateUploadListener(SUPABASE_URL);
            await refreshLiveDashboard(SUPABASE_URL);

        } catch (error) {
            console.error(error);
            showStatus('数据引擎对接断开，请刷新重试。', 'error');
        }
    }

    async function verifyAdminAuth() {
        if (!window.supabaseClient) return null;
        const { data: { session }, error } = await window.supabaseClient.auth.getSession();

        if (error || !session) {
            alert('错误：未检测到合法的登录状态！请在主页登录。');
            window.location.href = 'index.html';
            return null;
        }

        const { data: userPermission, error: dbError } = await window.supabaseClient
            .from('users')
            .select('is_admin')
            .eq('email', session.user.email)
            .maybeSingle();

        if (dbError || !userPermission || userPermission.is_admin !== true) {
            alert(`鉴权失败：账号 ${session.user.email} 无控制台访问特权。`);
            window.location.href = 'index.html';
            return null;
        }
        
        return session;
    }

    function activateUploadListener(supabaseUrl) {
        const uploadBtn = document.getElementById('upload-btn');
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');

        uploadBtn.disabled = false;

        fileInput.addEventListener('change', () => {
            selectedFilesCache = Array.from(fileInput.files);
            if (selectedFilesCache.length > 0) {
                dropZone.querySelector('.dropzone-text').innerHTML = `已选中 <em style="color:#2ed573; font-weight:bold;">${selectedFilesCache.length}</em> 张图片，准备就绪。`;
            }
        });

        uploadBtn.addEventListener('click', async () => {
            if (selectedFilesCache.length === 0) {
                alert('请先拍照或选取相册图片！');
                return;
            }

            const section = document.getElementById('page-section').value;
            showStatus(`⚡ 正在并发上传 ${selectedFilesCache.length} 张图片到云仓预览缓冲区...`, 'info');

            try {
                for (let i = 0; i < selectedFilesCache.length; i++) {
                    const file = selectedFilesCache[i];
                    const fileName = `${section}_${i}.png`; 
                    
                    await window.supabaseClient.storage
                        .from('images')
                        .upload(`images/${fileName}`, file, { upsert: true });
                }

                showStatus('🎉 预览库更新成功！请在下方核对多图，核对无误后点击“一键部署”。', 'success');
                selectedFilesCache = [];
                fileInput.value = '';
                dropZone.querySelector('.dropzone-text').innerHTML = '点击批量选择相册文件或拍照';
                
                await refreshLiveDashboard(supabaseUrl);

            } catch (err) {
                showStatus('上传流发生阻断: ' + err.message, 'error');
            }
        });
    }

    // 🎯 修复方案：动态异步探测，彻底解决并发 404 导致控制台白屏、加载慢的问题
    async function refreshLiveDashboard(supabaseUrl) {
        const wrapper = document.getElementById('sections-wrapper');
        if (!wrapper) return;

        const sections = [
            { id: 'section_banner', name: '首页 Banner 大图轮播区', maxCount: 5 },
            { id: 'section_anime', name: '动漫版面轮播区', maxCount: 4 },
            { id: 'section_community', name: '社区交流轮播区', maxCount: 4 },
            { id: 'section_recommend', name: '热门强推卡牌轮播区', maxCount: 4 }
        ];

        wrapper.innerHTML = '';

        for (const item of sections) {
            const block = document.createElement('div');
            block.className = 'dashboard-section';
            block.innerHTML = `
                <div class="section-header">
                    <div class="section-title">📺 ${item.name}</div>
                    <button class="deploy-btn" onclick="deploySection('${item.id}', ${item.maxCount}, '${supabaseUrl}')">🚀 一键部署到主页</button>
                </div>
            `;

            const grid = document.createElement('div');
            grid.className = 'image-flow-grid';

            for (let i = 0; i < item.maxCount; i++) {
                const card = document.createElement('div');
                card.className = 'img-preview-card';
                // 💡 关键微调：默认让卡片隐藏，不占位，不引发无效报错
                card.style.display = 'none'; 
                card.id = `card-${item.id}-${i}`;
                card.innerHTML = `
                    <div class="img-container">
                        <img id="img-${item.id}-${i}" loading="lazy" />
                    </div>
                    <span class="badge">索引位置 [${i}]</span>
                `;
                grid.appendChild(card);

                // 在后台默默建立探测流
                const liveImgUrl = `${supabaseUrl}/storage/v1/object/public/images/images/${item.id}_${i}.png?t=${new Date().getTime()}`;
                
                const tester = new Image();
                tester.onload = function() {
                    // 只有图片真实存在且加载成功，才亮起这个卡片，挂载图片
                    const targetImg = document.getElementById(`img-${item.id}-${i}`);
                    const targetCard = document.getElementById(`card-${item.id}-${i}`);
                    if (targetImg && targetCard) {
                        targetImg.src = liveImgUrl;
                        targetCard.style.display = 'block';
                    }
                };
                tester.onerror = function() {
                    // 找不到图片则默默跳过，不阻塞任何前端渲染线程
                    console.log(`位置 [${item.id}_${i}] 暂无线上图片，已平滑忽略。`);
                };
                tester.src = liveImgUrl; // 触发后台异步请求
            }

            block.appendChild(grid);
            wrapper.appendChild(block);
        }
    }

    window.deploySection = async function(section, maxCount, supabaseUrl) {
        let deployedUrls = [];
        for (let i = 0; i < maxCount; i++) {
            const liveUrl = `${supabaseUrl}/storage/v1/object/public/images/images/${section}_${i}.png`;
            deployedUrls.push(`${liveUrl}?t=${new Date().getTime()}`);
        }

        try {
            showStatus(`正在下发 [${section}] 的部署指令...`, 'info');
            
            const { error } = await window.supabaseClient
                .from('site_config')
                .upsert([{ section: section, url: JSON.stringify(deployedUrls) }]);

            if (error) throw error;
            
            alert('✨ 部署指令已安全同步！主页相应版面多图轮播已实时覆盖。');
            showStatus('🎉 部署成功！前台数据流已刷新。', 'success');

        } catch (err) {
            alert('部署同步失败: ' + err.message);
            showStatus('部署失败: ' + err.message, 'error');
        }
    };

    function showStatus(msg, type) {
        const el = document.getElementById('upload-status');
        if (!el) return;
        el.style.display = 'block'; 
        el.innerText = msg;
        el.className = ''; 
        if (type === 'info') el.className = 'status-info';
        if (type === 'success') el.className = 'status-success';
        if (type === 'error') el.className = 'status-error';
    }

    document.addEventListener('DOMContentLoaded', initWorkflow);
</script>
</body>
</html>
