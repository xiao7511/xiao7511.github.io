<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内容管理后台 —— 终极控制台</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ==========================================
           🎨 二次元/像素现代主义：高级深色系后台主题样式 
           ========================================== */
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c20 0%, #15102a 100%);
            --panel-bg: rgba(25, 20, 45, 0.65);
            --border-glow: rgba(138, 43, 226, 0.3);
            --primary-glow: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            --accent-neon: #00f5ff;
            --text-main: #f1f2f6;
            --text-muted: #a4b0be;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid var(--border-glow);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(106, 17, 203, 0.1);
        }

        .header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0;
            font-weight: 800;
            background: linear-gradient(120deg, #ffffff, var(--accent-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .back-home-btn {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main) !important;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-decoration: none !important;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .back-home-btn:hover {
            background: var(--primary-glow);
            border-color: transparent;
            box-shadow: 0 5px 15px rgba(37, 117, 252, 0.4);
            transform: translateX(-4px);
        }

        .back-arrow { margin-right: 8px; }

        .upload-card {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        h2 {
            font-size: 1.2rem;
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        select {
            width: 100%;
            background: #1c1836;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
        }

        /* 拖拽区 */
        .dropzone-area {
            border: 2px dashed rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            padding: 35px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            margin: 20px 0;
        }

        .dropzone-area:hover {
            border-color: var(--accent-neon);
            background: rgba(0, 245, 255, 0.03);
        }

        input[type='file'] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
        }

        .action-btn {
            width: 100%;
            background: var(--primary-glow);
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 700;
            padding: 14px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(106, 17, 203, 0.3);
        }

        .action-btn:disabled { background: #2e2a44; color: var(--text-muted); cursor: not-allowed; }

        #upload-status {
            margin-top: 15px; padding: 12px; border-radius: 8px;
            font-size: 0.9rem; text-align: center; display: none;
        }
        .status-info { background: rgba(37, 117, 252, 0.15); color: #3a86ff; }
        .status-success { background: rgba(46, 213, 115, 0.15); color: #2ed573; }
        .status-error { background: rgba(255, 71, 87, 0.15); color: #ff4757; }

        /* 看板网格与部署系统布局 */
        .preview-dashboard { margin-top: 40px; }
        .dashboard-section {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px;
        }
        .section-title { font-weight: 700; color: var(--accent-neon); }
        
        .deploy-btn {
            background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
            color: white; border: none; padding: 8px 16px; border-radius: 8px;
            font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .deploy-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0, 206, 201, 0.4); }

        .image-flow-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px;
        }
        .img-preview-card {
            background: #110d24; border-radius: 8px; padding: 8px; text-align: center; position: relative;
        }
        .img-container { width: 100%; height: 90px; border-radius: 6px; overflow: hidden; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        .badge {
            font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 5px;
            background: rgba(255,255,255,0.1); color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-box">
            <h1>内容管理后台 —— 终极控制台</h1>
            <a href="index.html" class="back-home-btn"><span class="back-arrow">←</span> 返回站点主页</a>
        </div>

        <div class="upload-card">
            <h2><span>🔮</span> 批量上传文件 (支持多选同时上传)</h2>
            
            <div style="margin-bottom: 20px;">
                <label style="display:block; margin-bottom:8px; font-size:0.85rem; color:var(--text-muted);">目标更新版面</label>
                <select id="page-section">
                    <option value="section_banner">首页Banner大图轮播</option>
                    <option value="section_anime">动漫版面多图轮播</option>
                    <option value="section_community">社区交流多图轮播</option>
                    <option value="section_recommend">热门强推多图轮播</option>
                </select>
            </div>

            <div class="dropzone-area" id="drop-zone">
                <span style="font-size:2.5rem; display:block; margin-bottom:10px;">📥</span>
                <span class="dropzone-text">可同时选中多个文件拖拽至此，或 <em>点击批量浏览本地文件</em></span>
                <input type="file" id="file-input" accept="image/*" multiple />
            </div>

            <button id="upload-btn" class="action-btn" disabled>确认上传至预览缓冲区</button>
            <div id="upload-status"></div>
        </div>

        <div class="preview-dashboard">
            <h2><span>🖼️</span> 线上运行与待部署图库看台 (先预览，后部署)</h2>
            <div id="sections-wrapper">
                </div>
        </div>
    </div>

<script>
    window.supabaseClient = null;
    let selectedFilesCache = []; // 本地多文件缓存

    async function initWorkflow() {
        try {
            const workerUrl = 'https://supabase-config-api.xiao-ye751111.workers.dev/'; 
            const response = await fetch(workerUrl);
            if (!response.ok) throw new Error('Worker 秘钥中转失败');
            const config = await response.json();
            
            let cleanedUrl = (config.SUPABASE_URL || '').trim();
            if (cleanedUrl.endsWith('/')) cleanedUrl = cleanedUrl.slice(0, -1);

            window.supabaseClient = supabase.createClient(cleanedUrl, (config.SUPABASE_ANON_KEY || '').trim());
            
            const { data: { session } } = await window.supabaseClient.auth.getSession();
            if (!session || session.user.email !== 'xiao.ye751111@outlook.com') {
                window.location.href = 'index.html';
                return;
            }

            activateUploadListener(cleanedUrl);
            await refreshLiveDashboard(cleanedUrl);

        } catch (error) {
            showStatus('系统加载失败，请刷新重试。', 'error');
        }
    }

    function activateUploadListener(supabaseUrl) {
        const uploadBtn = document.getElementById('upload-btn');
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');

        uploadBtn.disabled = false;

        fileInput.addEventListener('change', () => {
            selectedFilesCache = Array.from(fileInput.files);
            if (selectedFilesCache.length > 0) {
                dropZone.querySelector('.dropzone-text').innerHTML = `已选中 <em style="color:#2ed573; font-weight:bold;">${selectedFilesCache.length}</em> 个文件，准备上传。`;
            }
        });

        // 批量向存储桶发射文件
        uploadBtn.addEventListener('click', async () => {
            if (selectedFilesCache.length === 0) {
                alert('请先选择或拖入图片！');
                return;
            }

            const section = document.getElementById('page-section').value;
            showStatus(`正在批量上传 ${selectedFilesCache.length} 张图片到预览库...`, 'info');

            try {
                // 依次循环处理多文件并行上传
                for (let i = 0; i < selectedFilesCache.length; i++) {
                    const file = selectedFilesCache[i];
                    // 动态命名：如 section_banner_0.png, section_banner_1.png
                    const fileName = `${section}_${i}.png`; 
                    
                    await window.supabaseClient.storage
                        .from('images')
                        .upload(`images/${fileName}`, file, { upsert: true });
                }

                showStatus('🎉 批量上传预览库成功！请在下方核对，确认无误后点击“一键部署”。', 'success');
                selectedFilesCache = [];
                fileInput.value = '';
                dropZone.querySelector('.dropzone-text').innerHTML = '可同时选中多个文件拖拽至此，或 <em>点击批量浏览本地文件</em>';
                
                // 刷新本地预览面板
                await refreshLiveDashboard(supabaseUrl);

            } catch (err) {
                showStatus('批量上传发生中断: ' + err.message, 'error');
            }
        });
    }

    // 渲染带有“部署”锁的控制面板
    async function refreshLiveDashboard(supabaseUrl) {
        const wrapper = document.getElementById('sections-wrapper');
        if (!wrapper) return;

        const sections = [
            { id: 'section_banner', name: '首页 Banner 大图轮播区', maxCount: 5 },
            { id: 'section_anime', name: '动漫版面轮播区', maxCount: 4 },
            { id: 'section_community', name: '社区交流轮播区', maxCount: 4 },
            { id: 'section_recommend', name: '热门强推卡牌轮播区', maxCount: 4 }
        ];

        wrapper.innerHTML = '';

        for (const item of sections) {
            const block = document.createElement('div');
            block.className = 'dashboard-section';

            // 头部：标题 + 一键部署按钮
            const header = document.createElement('div');
            header.className = 'section-header';
            header.innerHTML = `
                <div class="section-title">📺 ${item.name}</div>
                <button class="deploy-btn" onclick="deploySection('${item.id}', ${item.maxCount}, '${supabaseUrl}')">🚀 一键部署到主页</button>
            `;

            // 图片流网格布局
            const grid = document.createElement('div');
            grid.className = 'image-flow-grid';

            // 循环侦测生成可用的多图预览列
            for (let i = 0; i < item.maxCount; i++) {
                const card = document.createElement('div');
                card.className = 'img-preview-card';
                
                const liveImgUrl = `${supabaseUrl}/storage/v1/object/public/images/images/${item.id}_${i}.png?t=${new Date().getTime()}`;

                card.innerHTML = `
                    <div class="img-container">
                        <img src="${liveImgUrl}" onerror="this.parentElement.parentElement.style.display='none'"/>
                    </div>
                    <span class="badge">索引位置 [${i}]</span>
                `;
                grid.appendChild(card);
            }

            block.appendChild(header);
            block.appendChild(grid);
            wrapper.appendChild(block);
        }
    }

    // 💡 核心部署锁：点击后正式把当前版面的多图图片数组打包同步给数据库
    window.deploySection = async function(section, maxCount, supabaseUrl) {
        let deployedUrls = [];
        
        // 扫描拿到所有存在的有效预览图地址
        for (let i = 0; i < maxCount; i++) {
            const testUrl = `${supabaseUrl}/storage/v1/object/public/images/images/${section}_${i}.png`;
            // 简单通过 fetch 的 HEAD 请求检查文件在存储桶里是否真实上传存在
            try {
                const res = await fetch(testUrl, { method: 'HEAD' });
                if (res.ok) {
                    deployedUrls.push(`${testUrl}?t=${new Date().getTime()}`);
                }
            } catch (e) {}
        }

        if (deployedUrls.length === 0) {
            alert('当前该版面预览库没有任何图片，无法部署！');
            return;
        }

        try {
            // 将图片以 JSON 字符串数组形式优雅写入配置表的 url 字段中
            const { error } = await window.supabaseClient
                .from('site_config')
                .upsert([{ section: section, url: JSON.stringify(deployedUrls) }]);

            if (error) throw error;
            alert('✨ 部署指令已下发！该版面多图轮播已正式覆盖部署到主页。');

        } catch (err) {
            alert('部署同步失败: ' + err.message);
        }
    };

    function showStatus(msg, type) {
        const el = document.getElementById('upload-status');
        el.style.display = 'block'; el.className = ''; el.innerText = msg;
        if (type === 'info') el.classList.add('status-info');
        if (type === 'success') el.classList.add('status-success');
        if (type === 'error') el.classList.add('status-error');
    }

    document.addEventListener('DOMContentLoaded', initWorkflow);
</script>
</body>
</html>
