<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>内容管理后台 —— 终极自适应控制台</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ==========================================
           🎨 二次元/像素现代主义：高级深色系后台主题样式 
           ========================================== */
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c20 0%, #15102a 100%);
            --panel-bg: rgba(25, 20, 45, 0.75);
            --border-glow: rgba(138, 43, 226, 0.25);
            --primary-glow: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            --accent-neon: #00f5ff;
            --text-main: #f1f2f6;
            --text-muted: #a4b0be;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 20px 14px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            padding: 10px 0;
        }

        header h1 {
            font-size: 1.6rem;
            margin: 0 0 6px;
            background: linear-gradient(to right, #00f5ff, #ff6ec7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 245, 255, 0.2);
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .panel-title {
            font-size: 1rem;
            font-weight: bold;
            color: var(--accent-neon);
            margin: 0 0 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        input[type="text"], input[type="password"], select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 12px;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.25s ease;
        }

        input[type="text"]:focus, input[type="password"]:focus, select:focus {
            border-color: var(--accent-neon);
            box-shadow: 0 0 10px rgba(0, 245, 255, 0.15);
        }

        .btn {
            background: var(--primary-glow);
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(106, 17, 203, 0.3);
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(106, 17, 203, 0.45);
            filter: brightness(1.1);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-main);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .status-bar {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.82rem;
            display: none;
        }

        .status-info { background: rgba(37, 117, 252, 0.15); border: 1px solid rgba(37, 117, 252, 0.3); color: #70a1ff; }
        .status-success { background: rgba(46, 213, 115, 0.15); border: 1px solid rgba(46, 213, 115, 0.3); color: #2ed573; }
        .status-error { background: rgba(255, 71, 87, 0.15); border: 1px solid rgba(255, 71, 87, 0.3); color: #ff4757; }

        .admin-image-item { position: relative !important; }
        .admin-preview-wrapper { position: relative !important; overflow: visible !important; }
        .admin-image-delete-btn {
            position: absolute !important;
            top: -5px !important;
            right: -5px !important;
            width: 18px !important;
            height: 18px !important;
            background: #ff4757 !important;
            color: white !important;
            border: none !important;
            border-radius: 50% !important;
            font-size: 10px !important;
            font-weight: bold !important;
            display: flex !items: center !justify-content: center !z-index: 99 !important;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>DorisY 动漫世界 · 终极管理中心</h1>
        <p>控制台实时打通 Supabase 引擎，尊享秒级数据下发与图层覆盖</p>
    </header>

    <div class="panel" id="auth-panel" style="display: none;">
        <div class="panel-title">🔑 数据库最高安全通行权限验证</div>
        <div class="form-group">
            <label for="admin-email">管理员鉴权账号 (Owner Email)</label>
            <input type="text" id="admin-email" value="xiao.ye751111@outlook.com" readonly style="opacity: 0.7; background: rgba(255,255,255,0.03);">
        </div>
        <div class="form-group">
            <label for="admin-password">鉴权密钥令牌 (Access Secret Key)</label>
            <input type="password" id="admin-password" placeholder="请输入你的管理员安全密钥密码">
        </div>
        <button class="btn" id="btn-auth-verify">🔓 校验并激活全线数据链路</button>
    </div>

    <div class="panel" id="control-panel" style="display: none;">
        <div class="panel-title">📺 主页多图轮播图配置中心</div>
        <div class="form-group">
            <label>当前正在编辑的模块标识</label>
            <select id="config-section-select">
                <option value="section_banner" selected>首页大图轮播区 (section_banner)</option>
            </select>
        </div>

        <div id="admin-banner-manager-list" style="margin-top: 6px;">
            <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem;">正在安全握手并同步最新云端配置中...</p>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 8px;">
            <button class="btn btn-secondary" id="add-new-url-btn" type="button">➕ 在当前队列末尾追随一张新图</button>
            <div class="btn-group">
                <button class="btn" id="save-config-btn" type="button">💾 保存当前配置至云端</button>
                <button class="btn btn-danger" id="btn-deploy-live" type="button">🚀 闪电下发覆盖前台</button>
            </div>
            <button class="btn btn-secondary" onclick="window.location.href='index.html'" type="button" style="margin-top: 5px;">⬅️ 安全返回 DorisY 动漫主页</button>
        </div>
    </div>

    <div class="status-bar status-info" id="upload-status">系统已就位。</div>
</div>

<script>
    window.supabaseClient = null;
    let cachedLiveUrlsArray = []; 
    const FALLBACK_DEFAULT_URL = "images/IMG_4822.jpeg";

    const SUPABASE_URL = 'https://kogjjfccyncdszuuwlun.supabase.co';
    const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtvZ2pqZmNjeW5jZHN6dXV3bHVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4ODEwMDksImV4cCI6MjA5MDQ1NzAwOY0.JIjUQdbZYUM6Cu57pFVwVzrlTrvyYmFyE9eBRlR9Sec';

    // 🌟 强效初始化：每次强制清空可能导致 Invalid API Key 的本地旧会话破坏
    function createFreshClient(skipSession = false) {
        if (typeof supabase !== 'undefined') {
            // 如果强制跳过会话缓存，先物理抹除浏览器的会话存储，防止幽灵缓存作恶
            if (skipSession) {
                try {
                    localStorage.removeItem('sb-kogjjfccyncdszuuwlun-auth-token');
                } catch(e){}
            }
            return supabase.createClient(SUPABASE_URL, ANON_KEY, {
                auth: { 
                    persistSession: !skipSession, 
                    autoRefreshToken: true,
                    detectSessionInUrl: false
                },
                global: {
                    headers: {
                        'apikey': ANON_KEY,
                        'Authorization': `Bearer ${ANON_KEY}`
                    }
                }
            });
        }
        return null;
    }

    document.addEventListener('DOMContentLoaded', async () => {
        const passwordInput = document.getElementById('admin-password');
        const authBtn = document.getElementById('btn-auth-verify');
        const authPanel = document.getElementById('auth-panel');
        const controlPanel = document.getElementById('control-panel');
        const addNewBtn = document.getElementById('add-new-url-btn');
        const saveConfigBtn = document.getElementById('save-config-btn');
        const deployLiveBtn = document.getElementById('btn-deploy-live');

        // 先尝试静默检查主页带过来的状态
        window.supabaseClient = createFreshClient(false);

        async function checkSessionAndInitialize() {
            showStatus('🔐 正在智能检索并校对主页活动会话通行证...', 'info');
            try {
                if (!window.supabaseClient) return;
                const { data: { session }, error } = await window.supabaseClient.auth.getSession();
                const currentEmail = session?.user?.email;

                if (!error && currentEmail === 'xiao.ye751111@outlook.com') {
                    showStatus('🎉 欢迎回来，管理员 Xiao Ye！', 'success');
                    authPanel.style.display = 'none';
                    controlPanel.style.display = 'flex';
                    await fetchLatestBannerConfig();
                } else {
                    // 如果检查遇到问题，直接亮起密码框
                    showStatus('🔒 请输入管理员安全密钥密码以激活全线数据链路...', 'info');
                    authPanel.style.display = 'flex';
                    controlPanel.style.display = 'none';
                }
            } catch (err) {
                authPanel.style.display = 'flex';
                controlPanel.style.display = 'none';
            }
        }

        await checkSessionAndInitialize();

        // ==========================================
        // 🎯 核心防假死登录逻辑
        // ==========================================
        authBtn.addEventListener('click', async () => {
            const password = passwordInput.value;
            if (!password) { alert('请输入管理员密钥专区通行密码！'); return; }
            showStatus('正在执行指纹对比与密码安全验证...', 'info');

            try {
                // 🚀 【关键改动】点击时彻底抛弃之前的本地干扰环境，生成沙盒级纯净客户端
                window.supabaseClient = createFreshClient(true);

                if (!window.supabaseClient) {
                    alert("Supabase 库未正确加载，请刷新页面！");
                    return;
                }

                // 直接调用登录
                const { data, error } = await window.supabaseClient.auth.signInWithPassword({
                    email: 'xiao.ye751111@outlook.com',
                    password: password
                });

                if (error) {
                    console.error('登录被系统拦截:', error.message);
                    // 彻底阻断底层的恶性报错干扰，通过业务翻译提示
                    if (error.message.includes('Invalid API key') || error.status === 400 || error.status === 401) {
                        showStatus('验证失败：密码输入不正确，请重新核对后再试！', 'error');
                        alert('鉴权失败：输入的密码与云端不匹配，请重新检查密码输入！');
                    } else {
                        showStatus('错误: ' + error.message, 'error');
                        alert('连接异常: ' + error.message);
                    }
                    return; 
                }

                // 认证彻底通过，重新初始化一个允许存储 Session 的客户端保证后续操作不丢失登录态
                const finalToken = data.session?.access_token;
                window.supabaseClient = supabase.createClient(SUPABASE_URL, ANON_KEY, {
                    auth: { persistSession: true, autoRefreshToken: true },
                    global: { headers: { 'Authorization': `Bearer ${finalToken}` } }
                });

                showStatus('👑 管理员密码验证通过！正在接管控制面板...', 'success');
                authPanel.style.display = 'none';
                controlPanel.style.display = 'flex';

                await fetchLatestBannerConfig();
            } catch (err) {
                showStatus('防御锁截获运行时异常: ' + err.message, 'error');
            }
        });

        // 渲染管理列表
        window.renderAdminBannerList = function(imageUrlsArray) {
            cachedLiveUrlsArray = imageUrlsArray || [];
            const container = document.getElementById('admin-banner-manager-list');
            if (!container) return;
            container.innerHTML = ''; 

            if (cachedLiveUrlsArray.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted); text-align:center; padding:16px; font-size:0.85rem;">当前暂无配置图片，请点击下方按钮新增~</p>';
                return;
            }

            cachedLiveUrlsArray.forEach((url, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'admin-image-item';
                itemDiv.style.display = 'flex';
                itemDiv.style.alignItems = 'center';
                itemDiv.style.gap = '12px';
                itemDiv.style.background = 'rgba(255, 255, 255, 0.05)';
                itemDiv.style.border = '1px solid rgba(255, 255, 255, 0.1)';
                itemDiv.style.padding = '10px';
                itemDiv.style.borderRadius = '12px';
                itemDiv.style.marginBottom = '12px';

                itemDiv.innerHTML = `
                    <div class="admin-preview-wrapper" style="position: relative; width: 80px; height: 50px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.15); flex-shrink: 0;">
                        <img src="${url || FALLBACK_DEFAULT_URL}" alt="预览" style="width:100%; height:100%; object-fit:cover; border-radius:6px;" onerror="this.src='images/IMG_4822.jpeg'">
                        <button type="button" class="admin-image-delete-btn" data-index="${index}">✕</button>
                    </div>
                    <input type="text" class="admin-banner-input" value="${url}" placeholder="请输入合法的 URL 线上链接" style="flex:1; background:rgba(0,0,0,0.2); border:1px solid rgba(255, 255, 255, 0.1); color:white; padding:6px; border-radius:6px; font-size:0.8rem;" data-index="${index}">
                `;
                container.appendChild(itemDiv);
            });

            container.querySelectorAll('.admin-image-delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const targetIndex = parseInt(btn.dataset.index);
                    if (confirm(`确定要从当前的轮播队列中删除第 ${targetIndex + 1} 张图片吗？`)) {
                        cachedLiveUrlsArray.splice(targetIndex, 1);
                        window.renderAdminBannerList(cachedLiveUrlsArray);
                    }
                });
            });

            container.querySelectorAll('.admin-banner-input').forEach(input => {
                input.addEventListener('input', () => {
                    const idx = parseInt(input.dataset.index);
                    cachedLiveUrlsArray[idx] = input.value.trim();
                    const img = input.parentElement.querySelector('.admin-preview-wrapper img');
                    if (img) img.src = input.value.trim() || FALLBACK_DEFAULT_URL;
                });
            });
        };

        async function fetchLatestBannerConfig() {
            try {
                const { data, error } = await window.supabaseClient
                    .from('site_config')
                    .select('url')
                    .eq('section', 'section_banner')
                    .maybeSingle();

                if (error) throw error;
                let liveUrls = [];
                if (data && data.url) { liveUrls = JSON.parse(data.url); }
                window.renderAdminBannerList(liveUrls);
                showStatus('🎉 成功同步最新云端配置。', 'success');
            } catch (err) {
                window.renderAdminBannerList([]);
            }
        }

        addNewBtn.addEventListener('click', () => {
            cachedLiveUrlsArray.push('');
            window.renderAdminBannerList(cachedLiveUrlsArray);
        });

        saveConfigBtn.addEventListener('click', async () => {
            const cleanedUrls = cachedLiveUrlsArray.filter(u => u.trim() !== '');
            showStatus('正在同步至云端数据库...', 'info');
            saveConfigBtn.disabled = true;
            try {
                const { error } = await window.supabaseClient
                    .from('site_config')
                    .upsert([{ section: 'section_banner', url: JSON.stringify(cleanedUrls) }]);
                if (error) throw error;
                showStatus('💾 完美存档至 site_config 数据表。', 'success');
                alert('🎉 轮播项修改已成功同步上云存档！');
                window.renderAdminBannerList(cleanedUrls);
            } catch (err) {
                alert('同步保存失败: ' + err.message);
            } finally { saveConfigBtn.disabled = false; }
        });

        deployLiveBtn.addEventListener('click', async () => {
            if (typeof window.deploySectionImages === 'function') {
                await window.deploySectionImages('section_banner', 5, SUPABASE_URL);
            } else {
                saveConfigBtn.click();
            }
        });
    });

    function showStatus(msg, type) {
        const el = document.getElementById('upload-status');
        if (!el) return;
        el.style.display = 'block';
        el.className = `status-bar status-${type}`;
        el.textContent = msg;
    }

    window.deploySectionImages = async function(section, maxCount, supabaseUrl) {
        let deployedUrls = [];
        for (let i = 0; i < maxCount; i++) {
            const liveUrl = `${supabaseUrl}/storage/v1/object/public/images/images/${section}_${i}.png`;
            deployedUrls.push(`${liveUrl}?t=${new Date().getTime()}`);
        }
        try {
            showStatus(`正在下发 [${section}] 的部署指令...`, 'info');
            const { error } = await window.supabaseClient
                .from('site_config')
                .upsert([{ section: section, url: JSON.stringify(deployedUrls) }]);
            if (error) throw error;
            alert('✨ 部署指令已安全同步！主页对应版面已实时覆盖。');
            showStatus('🎉 部署成功！前台数据流已刷新。', 'success');
        } catch (err) {
            alert('部署同步失败: ' + err.message);
        }
    };
</script>
</body>
</html>
