name: Deploy to GitHub Pages
on:  push:    branches:      - main
jobs:  deploy:    runs-on: ubuntu-latest    steps:      - name: Check out the repository        uses: actions/checkout@v2        with:          fetch-depth: 0
- name: Set up Node.js        uses: actions/setup-node@v2        with:          node-version: '14'
- name: Install dependencies        run: npm install
- name: Build the project        run: npm run build
