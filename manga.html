<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漫画连载 - DorisY</title>
    <style>
        * {margin:0; padding:0; box-sizing:border-box;}
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #121024; color: #fff; padding-top: 90px; padding-bottom: 40px;}
        
        /* 导航栏 */
        .header { position: fixed; top:0; width:100%; height:70px; background: #0b091a; display: flex; align-items:center; justify-content:space-between; padding: 0 5%; z-index:1000; border-bottom: 1px solid rgba(255,110,199,0.15);}
        .logo-link { color: #FF6EC7; text-decoration: none; font-weight: bold; font-size: 18px; }
        .nav {display:flex; gap:20px;}
        .nav-item {color: #a4b0be; text-decoration: none; font-size: 14px; font-weight: 500;}
        .nav-item:hover { color: #FF6EC7; }

        /* 漫画列表布局 */
        .manga-section { padding: 0 5%; max-width: 900px; margin: 0 auto; }
        .manga-list { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
        
        .manga-item { 
            display: flex; background: rgba(255,255,255,0.04); border-radius: 12px; 
            overflow: hidden; height: 180px; transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .manga-item:hover { transform: translateY(-2px); border-color: #FF6EC7; box-shadow: 0 4px 15px rgba(255,110,199,0.2); }
        
        /* 封面锁定，物理智能裁剪撑满 */
        .manga-cover-box { width: 130px; height: 100%; flex-shrink: 0; overflow: hidden; }
        .manga-cover { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
        
        .manga-detail { flex: 1; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        .manga-title { font-size: 1.2rem; color: #fff; margin-bottom: 4px; font-weight: bold;}
        .manga-update { font-size: 0.85rem; color: #a4b0be; }
        
        .read-btn {
            align-self: flex-start; padding: 8px 24px; 
            background: linear-gradient(135deg, #FF6EC7 0%, #ff4757 100%); 
            border: none; color: #fff; font-weight: bold; font-size: 0.85rem;
            border-radius: 50px; cursor: pointer; box-shadow: 0 3px 8px rgba(255,110,199,0.3);
            transition: opacity 0.2s;
        }
        .read-btn:hover { opacity: 0.9; }

        @media(max-width: 600px) { 
            .manga-item { height: 140px; } 
            .manga-cover-box { width: 100px; } 
            .manga-detail { padding: 12px; }
            .manga-title { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <a class="logo-link" href="index.html">DorisY动漫</a>
        <div class="nav">
            <a href="index.html" class="nav-item">首页</a>
            <a href="recommend.html" class="nav-item">动漫推荐</a>
            <a href="manga.html" class="nav-item" style="color:#FF6EC7">漫画连载</a>
            <a href="community.html" class="nav-item">社区</a>
        </div>
    </div>

    <div class="manga-section">
        <h2>📖 最新连载更新</h2>
        
        <div class="manga-list" id="dynamic-manga-container">
            <div style="text-align: center; color: #a4b0be; padding: 40px;">⚡ 正在建立安全连接，同步连载数据...</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // 🌟 使用你已有的 Worker 加密网关
                const workerUrl = 'https://supabase-config-api.xiao-ye751111.workers.dev/';
                const apiTarget = `${workerUrl.replace(/\/$/, '')}/api/manga`;
                
                const response = await fetch(apiTarget);
                if (!response.ok) throw new Error("网关无响应");
                const data = await response.json();

                const container = document.getElementById('dynamic-manga-container');
                if (!container) return;
                container.innerHTML = '';

                if (!data || data.length === 0) {
                    container.innerHTML = '<div style="text-align:center;color:#a4b0be;padding:20px;">💡 后台暂未上架任何漫画连载内容。</div>';
                    return;
                }

                // 动态装载结构
                data.forEach(item => {
                    const itemBox = document.createElement('div');
                    itemBox.className = 'manga-item';
                    const jumpTarget = `detail.html?category=${item.category}&slot=${item.slot_index}`;

                    itemBox.innerHTML = `
                        <div class="manga-cover-box" onclick="window.location.href='${jumpTarget}'" style="cursor:pointer;">
                            <img src="${item.cover_url || 'placeholder.png'}" class="manga-cover" loading="lazy" decoding="async">
                        </div>
                        <div class="manga-detail">
                            <div>
                                <div class="manga-title" onclick="window.location.href='${jumpTarget}'" style="cursor:pointer;">${item.title || '未命名连载'}</div>
                                <div class="manga-update">${item.subtitle || '连载中'}</div>
                            </div>
                            <button class="read-btn" onclick="window.location.href='${jumpTarget}'">开始阅读</button>
                        </div>
                    `;
                    container.appendChild(itemBox);
                });

            } catch (err) {
                console.error("加载漫画连载失败:", err);
                document.getElementById('dynamic-manga-container').innerHTML = `<div style="text-align:center;color:#ff4757;padding:20px;">❌ 数据流同步失败，请检查边缘网关状态。</div>`;
            }
        });
    </script>
</body>
</html>
