<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="动漫推荐页，浏览热门题材、精选作品与个性化推荐。">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://xiao7511.github.io/recommend.html">
  <title>动漫推荐 - DorisY</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">DorisY动漫</a>
    <nav class="nav" aria-label="主导航">
      <a href="index.html" class="nav__link">首页</a>
      <a href="recommend.html" class="nav__link is-active">动漫推荐</a>
      <a href="manga.html" class="nav__link">漫画连载</a>
      <a href="community.html" class="nav__link">社区</a>
    </nav>
  </header>

  <main class="main-content">
    <section class="section" aria-labelledby="page-title">
      <div class="section__head">
        <h1 id="page-title">发现精彩动漫</h1>
        <p>通过边缘云盾网关实时同步后台推荐的优质作品。</p>
      </div>

      <div class="cards" id="dynamic-recommend-container">
        <div style="text-align: center; color: #a4b0be; padding: 40px; grid-column: 1/-1;">⚡ 正在通过加密通道加载动漫推荐...</div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2025 DorisY动漫世界. Powered by Cloudflare Workers.</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            // 🌟 统一使用已有的 Cloudflare Worker 加密网关
            const workerUrl = 'https://supabase-config-api.xiao-ye751111.workers.dev/';
            const apiTarget = `${workerUrl.replace(/\/$/, '')}/api/recommend`;
            
            const response = await fetch(apiTarget);
            if (!response.ok) throw new Error("网关响应异常");
            const data = await response.json();

            const container = document.getElementById('dynamic-recommend-container');
            if (!container) return;
            container.innerHTML = '';

            if (!data || data.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:#a4b0be;grid-column:1/-1;">💡 后台暂未发布任何动漫推荐内容。</div>';
                return;
            }

            // 循环遍历生成全撑满智能裁剪卡片
            data.forEach(item => {
                const card = document.createElement('article');
                card.className = 'card';
                card.style.cssText = "cursor: pointer; display: flex !important; flex-direction: column !important; height: 100% !important; overflow: hidden !important;";
                
                // 点击后直接进入统一详情预览页
                card.onclick = () => {
                    window.location.href = `detail.html?category=${item.category}&slot=${item.slot_index}`;
                };

                const tagsText = (item.theme_tags || []).join(' / ') || item.subtitle || '精品推荐';

                // 物理内联样式锁死宽高，实现智能居中裁剪填充，绝不留白边
                card.innerHTML = `
                  <div style="width: 100% !important; height: 280px !important; overflow: hidden !important; display: block !important;">
                      <img src="${item.cover_url || 'images/IMG_4893.png'}" 
                           alt="${item.title}" 
                           style="width: 100% !important; height: 100% !important; object-fit: cover !important; object-position: center !important; display: block !important;"
                           loading="lazy" decoding="async">
                  </div>
                  <div class="card__body" style="padding: 16px !important; flex-grow: 1 !important;">
                    <h2 class="card__title" style="margin: 0 0 6px 0 !important; font-size: 1.2rem !important; color: #fff !important; font-weight: bold;">${item.title || '未命名作品'}</h2>
                    <p class="card__tag" style="margin: 0 !important; font-size: 0.85rem !important; color: #FF6EC7 !important;">${tagsText}</p>
                  </div>
                `;
                container.appendChild(card);
            });

        } catch (err) {
            console.error("加载动漫推荐失败:", err);
            document.getElementById('dynamic-recommend-container').innerHTML = `<div style="text-align:center;color:#ff4757;grid-column:1/-1;">❌ 安全隔离通道数据请求失败，请检查 Worker 配置。</div>`;
        }
    });
  </script>
</body>
</html>
