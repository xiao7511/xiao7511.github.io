<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#FF6EC7">

  <title>DorisY动漫世界</title>

  <link rel="preconnect" href="https://api.dicebear.com">
  <link rel="stylesheet" href="assets/css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="assets/js/main.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html" aria-label="返回首页">DorisY动漫世界</a>
    <nav class="nav" aria-label="主导航">
      <a href="index.html" class="nav__link is-active">首页</a>
      <a href="recommend.html" class="nav__link">动漫推荐</a>
      <a href="manga.html" class="nav__link">漫画连载</a>
      <a href="community.html" class="nav__link">社区</a>
      <button id="user-btn" class="nav__button" type="button">登录/注册</button>
      <div id="admin-entrance-wrapper" style="display: none;">
          <a href="admin.html" class="admin-entrance-btn">
              <svg class="admin-icon" viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
              控制台
          </a>
      </div>
    </nav>
  </header>

  <main>
    <section class="hero" aria-label="首页横幅">
      <div class="hero__slides">
        <div class="hero__slide is-active">
          <img src="images/IMG_4822.jpeg" alt="动漫幻灯片 1" loading="eager">
        </div>
        <div class="hero__slide">
          <img src="images/IMG_4823.jpeg" alt="动漫幻灯片 2" loading="lazy">
        </div>
        <div class="hero__slide">
          <img src="images/IMG_4824.jpeg" alt="动漫幻灯片 3" loading="lazy">
        </div>
        <div class="hero__slide">
          <img src="images/IMG_4825.jpeg" alt="动漫幻灯片 4" loading="lazy">
        </div>
        <div class="hero__slide">
          <img src="images/IMG_4826.jpeg" alt="动漫幻灯片 5" loading="lazy">
        </div>
      </div>
      <div class="hero__content">
        <p class="eyebrow">二次元内容聚合站</p>
        <h1>发现你喜欢的动漫、漫画和同好</h1>
        <p class="hero__text">精选推荐、连载更新、社区互动，一页看完。</p>
      </div>
    </section>

    <section class="section" aria-labelledby="recommend-title">
      <div class="section__head">
        <h2 id="recommend-title">热门动漫推荐</h2>
        <p>精选四个热门方向，适合快速浏览。</p>
      </div>
      <div class="cards" id="anime-container">
        </div>
    </section>

    <section class="section">
      <div class="section__head">
        <h2>漫友互动社区</h2>
        <p>畅所欲言，分享你的动漫日常</p>
      </div>
      <div id="post-area" style="margin-bottom: 24px;">
        <textarea id="post-content" placeholder="输入你想说的话..." style="width:100%; min-height:80px; background:rgba(255,255,255,0.05); color:#fff; border:1px solid rgba(255,255,255,0.1); padding:12px; border-radius:8px; resize:vertical; font-family:inherit; margin-bottom:12px;"></textarea>
        <button id="publish-btn" class="nav__button" type="button" style="padding:10px 24px;">发布动态</button>
      </div>
      <div id="posts-list">
        </div>
    </section>
  </main>

  <div id="auth-modal" class="modal-overlay" hidden style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; place-items: center; padding: 20px;">
    <div class="modal-card" style="background: #1a1a2e; border: 1px solid #FF6EC7; border-radius: 12px; width: 100%; max-width: 420px; padding: 24px; position: relative; color: #fff;">
      <button id="modal-close" type="button" style="position: absolute; top: 12px; right: 12px; background: none; border: none; color: rgba(255,255,255,0.5); font-size: 1.5rem; cursor: pointer; line-height: 1;">&times;</button>
      
      <div class="modal-tabs" style="display: flex; gap: 16px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">
        <button id="tab-login" class="tab-btn is-active" style="background: none; border: none; color: #fff; font-size: 1.1rem; cursor: pointer; padding: 4px 8px;">登录</button>
        <button id="tab-reg" class="tab-btn" style="background: none; border: none; color: rgba(255,255,255,0.5); font-size: 1.1rem; cursor: pointer; padding: 4px 8px;">注册</button>
      </div>

      <form id="login-form">
        <div style="margin-bottom: 16px;">
          <label style="display: block; margin-bottom: 6px; font-size: 0.9rem; color: rgba(255,255,255,0.8);">电子邮箱</label>
          <input type="email" id="login-email" required style="width: 100%; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: #fff;">
        </div>
        <div style="margin-bottom: 16px;">
          <label style="display: block; margin-bottom: 6px; font-size: 0.9rem; color: rgba(255,255,255,0.8);">安全密码</label>
          <input type="password" id="login-password" required style="width: 100%; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: #fff;">
        </div>
        <button type="submit" style="width: 100%; padding: 12px; background: #FF6EC7; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer;">进入二次元世界</button>
        <div style="text-align: right; margin-top: 12px;">
          <button id="forgot-password-btn" type="button" style="background: none; border: none; color: rgba(255,255,255,0.5); font-size: 0.85rem; cursor: pointer; text-decoration: underline;">忘记密码了喵？</button>
        </div>
      </form>

      <form id="reg-form" hidden style="display: none;">
        <div style="margin-bottom: 12px;">
          <label style="display: block; margin-bottom: 4px; font-size: 0.85rem;">电子邮箱</label>
          <input type="email" id="reg-email" required style="width: 100%; padding: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: #fff;">
        </div>
        <div style="margin-bottom: 12px;">
          <label style="display: block; margin-bottom: 4px; font-size: 0.85rem;">设定密码</label>
          <input type="password" id="reg-password" required style="width: 100%; padding: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: #fff;">
        </div>
        <div style="margin-bottom: 12px;">
          <label style="display: block; margin-bottom: 4px; font-size: 0.85rem;">玩家昵称</label>
          <input type="text" id="reg-nickname" placeholder="不填默认：新漫友" style="width: 100%; padding: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: #fff;">
        </div>
        
        <div style="margin-bottom: 12px;">
          <label style="display: block; margin-bottom: 6px; font-size: 0.85rem;">选择初始预设头像</label>
          <div class="avatar-options-grid" style="display: flex; gap: 10px; justify-content: center; margin-bottom: 10px;">
            <button type="button" class="avatar-option is-selected" data-avatar="https://api.dicebear.com/7.x/bottts/svg?seed=Neko" style="background: none; border: 2px solid transparent; padding: 2px; cursor: pointer; border-radius: 50%;"><img src="https://api.dicebear.com/7.x/bottts/svg?seed=Neko" alt="Neko" style="width: 40px; height: 40px; border-radius: 50%;"></button>
            <button type="button" class="avatar-option" data-avatar="https://api.dicebear.com/7.x/bottts/svg?seed=Miku" style="background: none; border: 2px solid transparent; padding: 2px; cursor: pointer; border-radius: 50%;"><img src="https://api.dicebear.com/7.x/bottts/svg?seed=Miku" alt="Miku" style="width: 40px; height: 40px; border-radius: 50%;"></button>
            <button type="button" class="avatar-option" data-avatar="https://api.dicebear.com/7.x/bottts/svg?seed=Zoro" style="background: none; border: 2px solid transparent; padding: 2px; cursor: pointer; border-radius: 50%;"><img src="https://api.dicebear.com/7.x/bottts/svg?seed=Zoro" alt="Zoro" style="width: 40px; height: 40px; border-radius: 50%;"></button>
          </div>
          
          <div class="custom-avatar-upload" style="text-align: center; border: 1px dashed rgba(255,110,199,0.4); padding: 8px; border-radius: 6px; background: rgba(255,255,255,0.02);">
            <label for="reg-avatar-file" class="link-btn" style="cursor: pointer; display: block; color: #FF6EC7; font-size: 0.8rem;">📷 或者上传自定义本地头像 (PNG/JPG)</label>
            <input type="file" id="reg-avatar-file" accept="image/png, image/jpeg, image/jpg" style="display: none;">
            <div id="avatar-file-hint" style="font-size: 0.75rem; color: rgba(255,255,255,0.5); margin-top: 4px;"></div>
          </div>
        </div>
        <button type="submit" style="width: 100%; padding: 10px; background: #FF6EC7; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer;">创建异世界身份</button>
      </form>

      <form id="forgot-password-form" hidden style="display: none;">
        <h3 style="margin-top: 0; color: #FF6EC7; font-size: 1.1rem; margin-bottom: 12px;">🔒 申请密码重置链接</h3>
        <p style="font-size: 0.8rem; color: rgba(255,255,255,0.6); margin-bottom: 16px;">请输入您的注册账号邮箱，系统会自动发送一封安全的重置链接邮件给您。</p>
        <div style="margin-bottom: 16px;">
          <label style="display: block; margin-bottom: 6px; font-size: 0.9rem;">您的注册邮箱</label>
          <input type="email" id="forgot-email" required style="width: 100%; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: #fff;">
        </div>
        <button id="forgot-submit-btn" type="submit" style="width: 100%; padding: 12px; background: #FF6EC7; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer;">发送安全引导邮件</button>
        <div style="margin-top: 12px; text-align: left;">
          <button type="button" onclick="switchMode('login')" style="background:none; border:none; color:rgba(255,255,255,0.4); text-decoration:underline; font-size:0.8rem; cursor:pointer;">返回登录</button>
        </div>
      </form>

      <form id="user-profile-form" hidden style="display: none;">
        <h3 style="margin-top: 0; color: #FF6EC7; font-size: 1.1rem; margin-bottom: 12px;">🌟 个人账号维护面板</h3>
        <div style="margin-bottom: 16px; text-align: center; border: 1px dashed rgba(255,110,199,0.5); padding: 16px; border-radius: 8px; background: rgba(0,0,0,0.2);">
          <label for="edit-avatar-file" style="cursor: pointer; display: inline-block; padding: 8px 16px; background: rgba(255,110,199,0.1); border: 1px solid #FF6EC7; color: #FF6EC7; border-radius: 6px; font-size: 0.85rem; font-weight: bold;">
            选择本地照片作为新头像
          </label>
          <input type="file" id="edit-avatar-file" accept="image/png, image/jpeg, image/jpg" style="display: none;">
          <div id="edit-avatar-hint" style="font-size: 0.75rem; color: rgba(255,255,255,0.6); margin-top: 8px; font-style: italic;"></div>
        </div>
        <button id="update-avatar-submit-btn" type="submit" style="width: 100%; padding: 12px; background: #FF6EC7; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer;">立刻同步保存新头像</button>
      </form>

    </div>
  </div>

  <footer class="site-footer" style="text-align: center; padding: 20px; color: rgba(255,255,255,0.3); font-size: 0.85rem; margin-top: 40px; border-top: 1px solid rgba(255,255,255,0.05);">
    &copy; 2026 DorisY 动漫世界. All Rights Reserved.
  </footer>
</body>
</html>
